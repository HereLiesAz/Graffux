[package]
name = "graffux-wgpu"
version = "0.1.0"
edition = "2021"
description = "Graffux GPU stamp engine on wgpu (WGSL compute); the long-term single brush engine for Android and desktop"
publish = false
license = "UNLICENSED"

[lib]
name = "graffux_wgpu"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles", "dx12", "metal"] }
pollster = "1.0"
bytemuck = { version = "1", features = ["derive"] }
jni = "0.22"
log = "0.4"

[profile.release]
# opt-level 3, not "s": examples/resident_bench on Mesa lavapipe (software Vulkan, 2026-10, three
# interleaved runs each, ms) -- per frame (rectangle readback) s 0.85/0.71/0.75 vs 3 0.61/0.58/0.62,
# per frame (row band) s 0.84/0.74/0.77 vs 3 0.67/0.61/0.54; first-dab latency is GPU-bound and
# noisy (resident hit s 8.3-8.9 vs 3 7.1-10.1). The CPU-side hot path (scheduling, hashing, row
# copies) runs ~20% faster at 3; re-measure on a device if library size becomes a concern.
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
