name = "graffux"
main = "workers/stroke-relay/src/index.js"
compatibility_date = "2026-08-26"

# Stroke relay storage: a PRIVATE R2 bucket (no public access, no custom domain, no r2.dev URL).
# DELIBERATELY COMMENTED OUT. Workers Builds deploys this file for the whole `graffux` Worker (the website
# too) and uploads versions for pull requests; a binding to a bucket that does not exist fails every one of
# those builds. Until the binding is on, the relay answers 503 "store unavailable" and the app keeps its
# files and retries, so nothing is lost or published. To turn it on: create the bucket
# (`npx wrangler r2 bucket create graffux-stroke-data`), then uncomment these three lines and merge.
# [[r2_buckets]]
# binding = "STROKE_BUCKET"
# bucket_name = "graffux-stroke-data"

# 6 uploads per client address per minute, per Cloudflare location. The app uploads every pending
# session file back to back and stops at the first failure, so a normal backlog fits.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 6
  period = 60

# Serves ./docs (index.html, favicon.svg, PRIVACY_POLICY.md); the research notes in the same
# directory are excluded by docs/.assetsignore. Only `/v1/*` runs code: the stroke relay
# (workers/stroke-relay), which stores training sessions in the private R2 bucket. Everything else
# is a static asset and never invokes the Worker. No build step.
# If Workers Builds (dashboard) is connected to this repo, set its Build command to empty/`true`
# so it does not try to build the Gradle/Cargo/pip projects at the repo root, and Deploy to
# `npx wrangler deploy`. Non-production branch builds run `wrangler versions upload`, which needs
# the Worker to have been deployed once from the production branch.
[assets]
directory = "./docs"
run_worker_first = ["/v1/*"]
