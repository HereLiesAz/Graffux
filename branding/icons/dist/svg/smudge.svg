<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/smudge — A fist with the index put out, pointing exactly where the brush tip and the pencil point do. The hand itself is upright; only the finger is on the tool diagonal, and that is the whole fix. Eleven earlier drawings put the hand on the diagonal too, and every one of them came out as a long thing with a lump on the end: a rocket, a boot, a shoe on a ramp, a remote control, a lightbulb, a key, a revolver, a sledgehammer, a syringe. The constraint was the diagonal, not the drawing. Solid rather than outlined, because at 1.4 stroke a finger-wide tube has no inside left, and the curled knuckles are bumps along the back of the fist rather than separate columns. The finger has to be thin, too: drawn at the width of the earlier versions it reads as a forearm and the glyph becomes a fist punching. Distinct from the pan hand, which is an open palm with all five splayed. -->
  <path d="M3,18.2L9.3,13.6L10.4,8.4L12.6,7L14.6,7.8L16.6,6.8L18.6,7.8L20,10L20,15.2L18.2,17.8L14.4,18.6L11.6,17.6L10.9,15.7L4.6,20.3Z" fill="currentColor" stroke="none"/>
</svg>
