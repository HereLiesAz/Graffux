<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/smudge — A hand on the tool diagonal, index finger pointing exactly where the brush tip and the pencil point do. Drawn the same way the pan hand is drawn, because it is the only way a hand survives this size: the folded fingers are square columns with real gaps between them and the thumb is another square column.

This one is not solved. Nine drawings in, a blind viewer still calls it a sledgehammer, because a long thin finger off a compact block of palm is a sledgehammer. Everything tried: a bare capsule finger is a rocket; with a knuckle crease, a boot; short and fat over a wedge, a shoe on a ramp; slimmed and stood up, a remote control; the hand smoothed through a spline, a lightbulb; the hand as a plain mass with one shaft, a key; the thumb as a spur off the wrist, a revolver; a cuff at the wrist, a syringe; and the smear it drags has nowhere to go, because the fingertip is already in the corner of the frame. What is here is the best of the nine and it is still wrong. The next thing to try is the pan hand upright with three fingers folded, which gives up the shared tool direction. The thumb drawn as a spur off the wrist instead of a column rather than a spur — drawn as a spur off the wrist it is the hammer of a revolver, and the whole silhouette becomes a handgun. Every rounded version of this came back a key, a lightbulb or a mallet. Solid rather than outlined, because at 1.4 stroke a finger-wide tube has no inside left. Distinct from the pan hand, which is upright with all five splayed. -->
  <path d="M5.35,21.19L3.8,19.64L9.74,13.7L6.91,10.87L8.32,9.45L9.88,11.01L10.73,10.16L9.17,8.61L10.59,7.19L12.14,8.75L14.4,6.48L17.52,9.6L15.82,11.29L17.52,12.99L16.24,14.26L14.55,12.57L11.58,15.54L11.29,15.25Z" fill="currentColor" stroke="none"/>
</svg>
