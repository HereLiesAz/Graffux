  <!-- graffux/blob-brush — A large lobed filled form with a small brush just touching its edge. The output is a closed shape rather than a line, so the shape has to dominate — but it has to be lumpy while it does it. Everything about the brush's placement is forced: on a stalk above a round blob it is a bomb with a lit fuse, cropped to a stub against a pointed blob it is a beak and the blob is a bird. Laid flat across the top, pointing into the shape, it is a brush. -->
