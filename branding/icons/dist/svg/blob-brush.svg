<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/blob-brush — A large lobed filled form with a small brush just touching its edge. The output is a closed shape rather than a line, so the shape has to dominate — but it has to be lumpy while it does it. There is no brush in the glyph at all any more, because every position tried for one turned the pair into an animal or an object: on a stalk above the blob it was a bomb with a lit fuse, cropped short against it a beak, laid flat across the top a frying pan. The mark carries the idea on its own — a stroke that came out as a closed lumpy form instead of a line is the whole tool. -->
  <defs>
    <pattern id="gfxHatch-blob-brush" patternUnits="userSpaceOnUse"
             width="4.2" height="1.05">
      <line x1="0" y1="0.294" x2="4.2" y2="0.294"
            stroke="currentColor" stroke-width="0.3"/>
    </pattern>
  </defs>
  <path d="M3.4,19.4L5,12.4L9.6,8L15.4,6.8L19.6,9.4L20.6,13.8L16.4,17.4L10.4,18.2L6.6,21Z" fill="url(#gfxHatch-blob-brush)" stroke="none"/>
</svg>
