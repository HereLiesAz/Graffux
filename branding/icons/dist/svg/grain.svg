<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/grain — A film strip with speckle on it. Drawn as a square field of dashes it was a saltine cracker, indistinguishable from the noise filter; drawn with the sprockets as ticks outside the strip it was an integrated circuit with pins down both sides. The holes have to sit inside the film's own width, behind a margin rule, or they are legs.

The speckle is five equal dashes and no round mark. With three dashes and a dot in the frame it read as sperm under a microscope — a tapered stroke leading a blob is a tail leading a head, and round caps make every short stroke tapered. -->
