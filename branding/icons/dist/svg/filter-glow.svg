<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/filter-glow — A core with its light spreading past its own edge, the halo broken into four arcs so it reads as light rather than as an edge. An unbroken ring around a solid centre is a nipple, and it is also every target in the set. -->
  <defs>
    <pattern id="gfxHatch-filter-glow" patternUnits="userSpaceOnUse"
             width="4.2" height="1.05">
      <line x1="0" y1="0.294" x2="4.2" y2="0.294"
            stroke="currentColor" stroke-width="0.3"/>
    </pattern>
  </defs>
  <path d="M20.02,13.7A8.2,8.2 0 0,1 13.7,20.02 M10.3,20.02A8.2,8.2 0 0,1 3.98,13.7 M3.98,10.3A8.2,8.2 0 0,1 10.3,3.98 M13.7,3.98A8.2,8.2 0 0,1 20.02,10.3"/>
  <path d="M8.6,12A3.4,3.4 0 1,0 15.4,12A3.4,3.4 0 1,0 8.6,12Z" fill="url(#gfxHatch-filter-glow)" stroke="none"/>
</svg>
