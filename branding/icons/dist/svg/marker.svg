<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/marker — A cap wider than the barrel it sits on, and a felt tip cut hard across at an angle. The step at the cap is what stops it: a single rounded barrel of even width, banded or not, is a phone. A shallow bevel on the tip made it a USB stick, so the chisel is the loudest thing in the glyph — the chisel is the whole tool. -->
  <defs>
    <pattern id="gfxHatch-marker" patternUnits="userSpaceOnUse"
             width="4.2" height="1.05">
      <line x1="0" y1="0.294" x2="4.2" y2="0.294"
            stroke="currentColor" stroke-width="0.3"/>
    </pattern>
  </defs>
  <path d="M8.6,3.4L14.6,3.4A1,1 0 0,1 15.6,4.4L15.6,6.6A1,1 0 0,1 14.6,7.6L8.6,7.6A1,1 0 0,1 7.6,6.6L7.6,4.4A1,1 0 0,1 8.6,3.4Z"/>
  <path d="M16.6,4.6L16.6,9"/>
  <path d="M8.8,7.6L14.4,7.6L14.4,14L8.8,14Z"/>
  <path d="M8.8,14L14.4,14L14.4,20.6L8.8,16.6Z" fill="url(#gfxHatch-marker)" stroke="none"/>
</svg>
