<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/sponge — A solid block with suds coming off it. Six drawings, and the first five all tried to draw the sponge itself. As a torn blob with three round pores in it, which is what a sponge actually looks like, it was a slice of Swiss cheese to every rater who saw it, and a skull at small size once two pores overlapped into eye sockets: holes in a blob are cheese. With the underside wrung into points, the points were fangs and the drops were drool — a row of points along a solid edge is a jaw, which is what went wrong with the brush texture in the same round. Pinched at the waist it was a ticket stub. Given a soft irregular outline it was a thought bubble, a cloud, and a pair of buttocks. A lobed blob is a body before it is anything else; the block is a plain rectangle for that reason, and the bubbles carry the whole meaning. The block is deep rather than wide: flat and wide with bubbles over it, it was a bathtub. The bubbles rise in a line off one corner and are three, not two: two marks side by side above a mass are eyes, and a rater called the pair of them a blank cartoon face at every size, more strongly the smaller it got. -->
  <defs>
    <pattern id="gfxHatch-sponge" patternUnits="userSpaceOnUse"
             width="4.2" height="1.05">
      <line x1="0" y1="0.294" x2="4.2" y2="0.294"
            stroke="currentColor" stroke-width="0.3"/>
    </pattern>
  </defs>
  <path d="M4.9,7.8A1.3,1.3 0 1,0 7.5,7.8A1.3,1.3 0 1,0 4.9,7.8Z M8.05,4.8A0.95,0.95 0 1,0 9.95,4.8A0.95,0.95 0 1,0 8.05,4.8Z M10.75,2.6A0.65,0.65 0 1,0 12.05,2.6A0.65,0.65 0 1,0 10.75,2.6Z"/>
  <path d="M7.8,10.4L17.2,10.4A1.6,1.6 0 0,1 18.8,12L18.8,18.8A1.6,1.6 0 0,1 17.2,20.4L7.8,20.4A1.6,1.6 0 0,1 6.2,18.8L6.2,12A1.6,1.6 0 0,1 7.8,10.4Z" fill="url(#gfxHatch-sponge)" stroke="none"/>
</svg>
