<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/sponge — A solid block with suds coming off it. Six drawings, and the first five all tried to draw the sponge itself. As a torn blob with three round pores in it, which is what a sponge actually looks like, it was a slice of Swiss cheese to every rater who saw it, and a skull at small size once two pores overlapped into eye sockets: holes in a blob are cheese. With the underside wrung into points, the points were fangs and the drops were drool — a row of points along a solid edge is a jaw, which is what went wrong with the brush texture in the same round. Pinched at the waist it was a ticket stub. Given a soft irregular outline it was a thought bubble, a cloud, and a pair of buttocks. A lobed blob is a body before it is anything else; the block is a plain rectangle for that reason, and the bubbles carry the whole meaning. -->
  <path d="M6.7,6.6A1.3,1.3 0 1,0 9.3,6.6A1.3,1.3 0 1,0 6.7,6.6Z M11.45,4.4A0.95,0.95 0 1,0 13.35,4.4A0.95,0.95 0 1,0 11.45,4.4Z M15.5,7A0.7,0.7 0 1,0 16.9,7A0.7,0.7 0 1,0 15.5,7Z"/>
  <path d="M6,10L18,10A1.6,1.6 0 0,1 19.6,11.6L19.6,17.8A1.6,1.6 0 0,1 18,19.4L6,19.4A1.6,1.6 0 0,1 4.4,17.8L4.4,11.6A1.6,1.6 0 0,1 6,10Z" fill="currentColor" stroke="none"/>
</svg>
