<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/sponge — A block with a wrung, dripping underside and the drops falling from it. Drawn as a torn blob with three round pores in it, which is what a sponge actually looks like, it was a slice of Swiss cheese to every rater who saw it, and a skull at small size once two of the pores overlapped into a pair of eye sockets. Holes in a blob are cheese. What is unique to a sponge is not its holes but that it gives up liquid, so this is the block pinched at the waist with what it gave up falling below it. Drawn with the underside wrung into points, the points were fangs and the drops were drool: a row of points along a solid edge is a jaw, every time, which is the same thing that went wrong with the brush texture. -->
  <path d="M4.6,5.4L19.4,5.4L19.4,9.6L16.6,11.8L19.4,14L19.4,17.4L4.6,17.4L4.6,14L7.4,11.8L4.6,9.6Z"/>
  <path d="M8.3,20.2A1.1,1.1 0 1,0 10.5,20.2A1.1,1.1 0 1,0 8.3,20.2Z M13.75,19.4A0.85,0.85 0 1,0 15.45,19.4A0.85,0.85 0 1,0 13.75,19.4Z" fill="currentColor" stroke="none"/>
</svg>
