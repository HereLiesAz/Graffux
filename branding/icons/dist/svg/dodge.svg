<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/dodge — An opaque paddle on a bent wire, held between the lamp and the paper. The paddle is solid and empty: drawn hollow with three small circles in it — the obvious way to say a disc has depth — it was a bowling ball, then a face, then a US power outlet, in that order, from three different raters. Filled in and left round it was a sperm cell: a solid ball trailing a thin bent line is that silhouette exactly. The paddle is square because a darkroom paddle can be any shape, and a square one is neither a lens nor a cell. -->
  <path d="M13.8,13L20.6,19.8"/>
  <path d="M6.8,4L11.6,4A2.4,2.4 0 0,1 14,6.4L14,10.8A2.4,2.4 0 0,1 11.6,13.2L6.8,13.2A2.4,2.4 0 0,1 4.4,10.8L4.4,6.4A2.4,2.4 0 0,1 6.8,4Z" fill="currentColor" stroke="none"/>
</svg>
