<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/theme-toggle — One disc, half in each mode, and nothing else. The three rays that used to sit on the light side were legs: at 24 pixels the glyph read as a tick, or a mite — a dark round body with spikes coming off one side is an insect, and rays on one side only are never a sun. -->
  <defs>
    <pattern id="gfxHatch-theme-toggle" patternUnits="userSpaceOnUse"
             width="4.2" height="1.05">
      <line x1="0" y1="0.294" x2="4.2" y2="0.294"
            stroke="currentColor" stroke-width="0.3"/>
    </pattern>
  </defs>
  <path d="M4.4,12A7.6,7.6 0 1,0 19.6,12A7.6,7.6 0 1,0 4.4,12Z"/>
  <path d="M12,12L12,19.6A7.6,7.6 0 0,1 12,4.4Z" fill="url(#gfxHatch-theme-toggle)" stroke="none"/>
</svg>
