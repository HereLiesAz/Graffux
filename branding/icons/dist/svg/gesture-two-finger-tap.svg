<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/gesture-two-finger-tap — Two fingers reaching in from the upper right, of unequal length, coming down together on one surface. Drawn upright as two chevrons over two dots over a rule — the obvious shorthand for pressing — it was an angry cartoon face: two V eyebrows, two eyes and a flat mouth. Anything symmetrical with two marks above two marks above a bar is a face and a face is all anyone sees. Redrawn upright as two pointed shapes standing on the rule with the contacts below it, it was two houses on a wheeled cart, the points reading as roofs and the contacts as wheels. Angled, unequal and touching the surface directly, there is no symmetry left to fall into. -->
  <path d="M3.4,20.2L20.6,20.2"/>
  <path d="M15.34,4.38L8.64,19.22L10.16,19.98L17.86,5.62Z M19.49,8.33L13.52,19.19L14.88,20.01L21.71,9.67Z" fill="currentColor" stroke="none"/>
</svg>
