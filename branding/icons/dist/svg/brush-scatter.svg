<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/brush-scatter — One stamp landed, and four thrown clear of it at uneven distances, mostly to one side. No path drawn, because every path drawn turned into something else: on the diagonal with marks above and below it was a percent sign at every size, dashed or solid, through two drawings; laid horizontal and dashed, the dashes became a stitched-shut mouth and the marks around them eyes, and a rater called the glyph a goofy monster face; drawn as a curve it was a wavy mouth under two eyes, and a face again. Marks thrown to one side have no axis to hang a face on. -->
  <defs>
    <pattern id="gfxHatch-brush-scatter" patternUnits="userSpaceOnUse"
             width="4.2" height="1.05">
      <line x1="0" y1="0.294" x2="4.2" y2="0.294"
            stroke="currentColor" stroke-width="0.3"/>
    </pattern>
  </defs>
  <path d="M14.5,6.4A1.5,1.5 0 1,0 17.5,6.4A1.5,1.5 0 1,0 14.5,6.4Z"/>
  <path d="M18.4,12.4A1.2,1.2 0 1,0 20.8,12.4A1.2,1.2 0 1,0 18.4,12.4Z"/>
  <path d="M15.45,18A1.35,1.35 0 1,0 18.15,18A1.35,1.35 0 1,0 15.45,18Z"/>
  <path d="M5,5.8A1,1 0 1,0 7,5.8A1,1 0 1,0 5,5.8Z"/>
  <path d="M7,13.2A2.4,2.4 0 1,0 11.8,13.2A2.4,2.4 0 1,0 7,13.2Z" fill="url(#gfxHatch-brush-scatter)" stroke="none"/>
</svg>
