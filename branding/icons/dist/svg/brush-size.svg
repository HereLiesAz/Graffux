<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/brush-size — One footprint with its size taken off beside it. Drawn as two rings on one centre with a radius struck through them — the literal picture of a diameter — it was a dartboard with a dart in it, and at small size the rings merged and the radius became the bar of a no-entry sign. Concentric rings around a centre are a target whatever is meant by them, which is the same finding that took the ring off the brush cursor and the register mark. The measure goes underneath: stood beside the footprint as a vertical bar between two arrowheads, the pair of them read as the letters Oi, and at small size that was the only thing left. -->
  <path d="M6.4,9.6A5.6,5.6 0 1,0 17.6,9.6A5.6,5.6 0 1,0 6.4,9.6Z"/>
  <path d="M6.6,18.8L17.4,18.8"/>
  <path d="M4.8,18.8L6.8,20.24L6.8,17.36Z M19.2,18.8L17.2,17.36L17.2,20.24Z" fill="currentColor" stroke="none"/>
</svg>
