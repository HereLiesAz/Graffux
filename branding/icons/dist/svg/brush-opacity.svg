<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/brush-opacity — One swatch, solid at one end and down to the chequer at the other. Drawn as a disc with one half laid down and the other half a broken arc — the obvious picture of half-committed — it was the dark-mode toggle almost exactly, and this set has one of those: theme-toggle is a disc with one half solid and rays on the light side. A split disc belongs to day and night and cannot be borrowed. The chequer is three cells across and not two: at two cells it was the same diagonal pair of squares that sits inside alpha-lock, and a rater called this one a credit card with the chip knocked out. It runs solid, then chequer, then nothing, across three thirds: half solid against half chequer left the swatch mostly black with white notches in it, and a rater read the notches as a bar chart in negative. -->
  <path d="M3.4,7L20.6,7L20.6,17L3.4,17Z"/>
  <path d="M3.4,7L9.1,7L9.1,17L3.4,17Z M9.1,7L11.95,7L11.95,12L9.1,12Z M11.95,12L14.8,12L14.8,17L11.95,17Z" fill="currentColor" stroke="none"/>
</svg>
