<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/layer-flatten — Three sheets pressed down into one solid plate, each closer to it than the last. The rules are stepped to match the stack: left flush while the plate under them leaned, the two halves disagreed and the glyph was a hamburger menu sitting on a doormat. -->
  <defs>
    <pattern id="gfxHatch-layer-flatten" patternUnits="userSpaceOnUse"
             width="4.2" height="1.05">
      <line x1="0" y1="0.294" x2="4.2" y2="0.294"
            stroke="currentColor" stroke-width="0.3"/>
    </pattern>
  </defs>
  <path d="M4.2,5.6L20.6,3.6 M6,10L20,8.4 M7.8,14.2L19.4,13"/>
  <path d="M5.8,15.4L20.6,15.4L18.2,20.6L3.4,20.6Z" fill="url(#gfxHatch-layer-flatten)" stroke="none"/>
</svg>
