<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/path-simplify — One path, crowded with anchors along the first half and carrying two along the rest, drawn as the squares every vector tool draws anchors as — hollow where they are about to go, solid where they are kept. The meaning is in the density.

Drawn as a jagged run with beads on its peaks above a smooth curve below, it was a crown over a bow, and a face: points along the top with a curve under them is a mouth with teeth before it is anything to do with a path. Drawn as one curve with its anchors spread evenly along it, it was a sawtooth waveform with knobs on the ends — evenly spaced anchors are a zigzag, and the end ones read as terminals. -->
  <defs>
    <pattern id="gfxHatch-path-simplify" patternUnits="userSpaceOnUse"
             width="4.2" height="1.05">
      <line x1="0" y1="0.294" x2="4.2" y2="0.294"
            stroke="currentColor" stroke-width="0.3"/>
    </pattern>
  </defs>
