<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/brush-texture — A stroke that is solid where it started and broken into slivers where the tooth has taken it. Drawn as a bare field of scattered dashes it was spilled rice, and it was the fourth icon in the set to be a field of scattered dashes — the same picture as Add Noise, Reduce Noise and Grain. Redrawn as a black band with a sawtooth underside it was a mouth full of bared teeth, with the marks below it as the lower row: a regular row of points along a solid edge is a jaw, and nothing else gets a look in. Broken into four slivers of even width it was a barcode; the remnants have to be uneven in both width and height or they are bars, not grain. -->
  <path d="M3.4,8.4L9.8,7.6L10,13L3.6,13.8Z M11.2,7.8L13.2,7.6L13.4,12.6L11.4,12.8Z M14.6,9.6L15.8,9.4L16,11.6L14.8,11.8Z M17.2,8.2L18.2,8.1L18.4,12.4L17.4,12.5Z M19.6,10L20.4,9.9L20.5,11.4L19.7,11.5Z" fill="currentColor" stroke="none"/>
</svg>
