<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/crayon — Fat and short, with the paper label banded round the middle and the wax worn to a cone with a small flat left on it. A slim body with a sharp point is the pencil; a flat foot under a banded box is a battery, and a domed top over a banded box is a rifle cartridge. Flat top, a cone with barely any flat left on it, and the wrapper torn along its upper edge — a clean band left it in a pile with the eyedropper and the stylus, all three of which came back as "a fountain pen nib". Only the torn paper belongs to a crayon and nothing else. -->
  <defs>
    <pattern id="gfxHatch-crayon" patternUnits="userSpaceOnUse"
             width="4.2" height="1.05">
      <line x1="0" y1="0.294" x2="4.2" y2="0.294"
            stroke="currentColor" stroke-width="0.3"/>
    </pattern>
  </defs>
