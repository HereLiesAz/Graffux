<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     width="24" height="24" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/brush-hardness — A hard footprint and a soft one, deliberately unequal in size. Side by side and near-equal a rater called them a pair of testicles, or breasts: two adjacent circles of about the same size at about that spacing are that, whatever is drawn inside them. Stacked one above the other instead, they were a snowman, and anatomical again. Concentric was never an option: a ring with a filled circle inside it is a nipple, which is what the burn tool was, and a broken ring around a solid centre is a target, which is what the brush size was. Unequal and side by side is the only arrangement of two round things that has come back clean, and it costs a family resemblance to brush-roundness. The two stand clear of each other: hard against the solid one, the small ring read as a piercing through it. -->
