     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- graffux/eraser — A rubber block, banded, solid at the face doing the wiping, with the rubbings it has shed lying under it. The crumbs are the whole difference. Without them the block was a file folder with a dog-eared corner, a wallet, and a battery at sixty per cent — a rectangle part-filled along one edge is a fill gauge before it is an object. Redrawn as a block seen at an angle with the line it was clearing running out from under it, it was an open cardboard box with a stray bar floating underneath. Nothing sheds crumbs but an eraser. -->
