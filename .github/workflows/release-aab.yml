name: Release AAB to Play

# Builds a signed Android App Bundle and (optionally) publishes it to Google Play.
#
# Required repository secrets:
#   Signing (same ones used by release-apk.yml):
#     KEYSTORE_PRIVATE   - PEM private key for the upload key
#     KEYSTORE_CHAIN     - PEM certificate chain for the upload key
#     KEYSTORE_PASSWORD  - keystore password
#     KEY_ALIAS          - key alias
#     KEY_PASSWORD       - key password
#   Play publishing:
#     PLAY_SERVICE_ACCOUNT_JSON - the full JSON of a Google Cloud service account that has been
#       granted release permissions in the Play Console (Users & permissions). See SETUP below.
#
# SETUP (one-time):
#   1. Play Console → create the app, then enroll in Play App Signing (default). Sign with the
#      upload key above; Google holds the app-signing key.
#   2. Google Cloud Console → create a service account, create a JSON key, paste the JSON into the
#      PLAY_SERVICE_ACCOUNT_JSON secret. In the Play Console, invite that service account and grant
#      it "Release to testing tracks" (and Production if you intend to publish there).
#      Three things have to line up or every API call fails with 403 "The caller does not have
#      permission" even though the key authenticates fine — the secret is not the problem when
#      that happens, the grant is:
#        a. the service account is an accepted user in Play Console → Users & permissions, with
#           app access to com.hereliesaz.graffux (a pending invitation is not access);
#        b. the service account's GCP project is the one linked under Play Console → Setup →
#           API access (a key from any other project authenticates and is then refused);
#        c. the Google Play Android Developer API is enabled in that same GCP project.
#      publish_play.py prints the account and project it is using, and spells out this list on
#      a 403, so the run log names the identity that was rejected.
#   3. FIRST UPLOAD MUST BE MANUAL: Google's API cannot create the very first release for a new app.
#      Upload one AAB by hand in the Play Console once; after that this workflow can publish.
#   4. Create at least one release in the alpha (closed testing) track by hand — the Play API can
#      only add releases to tracks that already exist. (beta/production are not part of this
#      workflow's rollout today — see the note below.)
#
# Publishing rollout: one AAB, one Play Edit, two tracks — TARGETS in publish_play.py is the only
# authority on which; keep this comment in sync with it, not the other way around. `internal` goes
# live (status=completed); `alpha` is staged as a draft, ready to promote by hand in the Play
# Console. beta/production were dropped from TARGETS in a past commit that didn't update this
# comment — if you want them back, add the tuples in publish_play.py first.
# Implemented in `.github/scripts/publish_play.py` because Play rejects re-uploading the same
# versionCode, so a single Edit is the only way to hand one bundle to multiple tracks.
#
# versionCode is asked of Play, not read out of the repo: the "Determine next versionCode" step
# below takes Play's highest released code + 1 (floored at version.properties' versionBuild + 1)
# and hands it to Gradle as -PversionCodeOverride. It used to come straight from the committed
# version.properties, which this job cannot advance (contents: read, below), so any merge that
# didn't hand-bump that file rebuilt an already-published code and Play rejected the upload. The
# pre-publish check (`publish_play.py --version-code`) is still wired up behind this as a second
# line of defence. See "versionCode and Play publishing" in CLAUDE.md.

on:
  # Publish ONLY from main (plus manual dispatch). Publishing on every branch push staged whichever
  # branch built last as the Play draft and burned Google's daily edit-commit quota ("Daily save quota
  # exceeded"), so the newest AAB often never landed. Restricting to main means the staged draft is
  # always the latest merged build, and there are few enough commits that the quota holds.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Deliberately untyped (string), not `type: boolean`: every `if: … inputs.publish != 'false'`
      # below only excludes the exact string "false", so anything else (including a boolean `false`
      # coerced through `type: boolean`, which GitHub Actions expressions compare LOOSELY against a
      # quoted 'false' and do NOT treat as equal) publishes. Switching to `type: boolean` without
      # also rewriting every comparison to `!= false` (unquoted) would silently invert this input
      # for `false` and publish anyway — verify against a real dispatch run before making that
      # change, not just by reading it.
      publish:
        default: true
        description: 'Push the AAB to Play. Type exactly false (lowercase, no quotes) to build only.'

# Serialize Play publishes across ALL refs: the Play API allows only one open Edit per app, so two
# release-aab runs publishing at once (e.g. a merge to main overlapping a branch push) collide with
# "A change was made to the application outside of this Edit". `cancel-in-progress: false` only
# protects a run that's already publishing — it does NOT mean queued runs each get their turn.
# GitHub cancels a *pending* run in the same group the moment a newer one arrives, so three merges
# in quick succession publish the first and the third; the middle one is silently cancelled, not
# queued, and produces no publish and no red X. If that's a problem, merge one at a time or watch
# the Actions tab for cancelled runs.
concurrency:
  group: google-play-publish
  cancel-in-progress: false

# Least privilege: builds the AAB, uploads it as an artifact, and publishes to Google Play via the
# Play API (PLAY_SERVICE_ACCOUNT_JSON). It does not write back to the repo, so read is enough.
# Keeping it at `read` is deliberate and load-bearing: this job holds the signing key and the Play
# service-account credential for its whole lifetime, so write access here would widen what a
# compromised step could reach. Committing the versionCode bump back from CI was the obvious
# alternative fix and was rejected for exactly that reason — see the versionCode comment above for
# what replaced it.
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # SHA-pinned, not @v7: this job holds the signing key and the Play service-account
        # credential for its whole lifetime, so a compromised/re-tagged third-party action here
        # is a direct path to both. A major-version tag is a moving pointer; a commit SHA isn't.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Generate keystore from secrets
        shell: bash
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Cleanup runs on ANY exit, not just the happy path — without a trap, a failure in
          # openssl/keytool below (mismatched chain/key, bad password) aborts the step under
          # bash's `-e` before the old plain `rm` line, leaving the private key on disk for
          # whatever post-job steps run afterward.
          trap 'rm -f private_key.pem certificate_chain.crt keystore.p12' EXIT
          echo "$KEYSTORE_PRIVATE" > private_key.pem
          echo "$KEYSTORE_CHAIN" > certificate_chain.crt
          openssl pkcs12 -export -in certificate_chain.crt -inkey private_key.pem \
            -name "$KEY_ALIAS" -out keystore.p12 \
            -password pass:"$KEYSTORE_PASSWORD"
          # -destkeypass is load-bearing, not cosmetic: without it, keytool defaults the
          # imported key's password to -deststorepass (KEYSTORE_PASSWORD), NOT KEY_PASSWORD —
          # so the build step below, which opens the key with KEY_PASSWORD, only ever worked
          # because that secret happened to hold the same value as KEYSTORE_PASSWORD. Rotate
          # either one alone and every release build would die at signing with
          # UnrecoverableKeyException. Setting it explicitly here makes the two secrets
          # actually independent, matching what SETUP above documents them as.
          keytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 \
            -destkeystore app/keystore.jks -deststoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -noprompt

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Python
        if: ${{ inputs.publish != 'false' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # Hoisted out of the publish step so the versionCode query below can use it too. These are
      # exactly what publish_play.py imports; installing google-auth alone leaves googleapiclient
      # and httplib2 missing.
      - name: Install Play API client
        if: ${{ inputs.publish != 'false' }}
        run: |
          python -m pip install --quiet \
            google-auth==2.35.0 \
            google-api-python-client==2.149.0 \
            google-auth-httplib2==0.2.0 \
            httplib2==0.22.0

      # THE fix for the recurring "Version code N has already been used" rejection. versionCode
      # used to be derived purely from the committed version.properties, which this job cannot
      # advance (contents: read, by design — it holds the signing key). So every merge that didn't
      # hand-bump version.properties rebuilt the versionCode the previous merge had already
      # published, and Play refused it: runs 235-237 all rebuilt 481 after 234 published it, and
      # 241/246 both rebuilt 486 after 240 published it. Asking Play what it already has removes
      # the human step entirely.
      #
      # --floor keeps version.properties meaningful: a deliberate hand-edited jump still wins.
      # If the query fails, the script warns and falls back to the floor — i.e. the old behaviour,
      # with the pre-publish check further down still guarding correctness.
      - name: Determine next versionCode
        id: nextcode
        if: ${{ inputs.publish != 'false' }}
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON//[[:space:]]/}" ]; then
            echo "::error::Repository secret PLAY_SERVICE_ACCOUNT_JSON is empty or not set. Add it under Settings > Secrets and variables > Actions with the full service-account key JSON."
            exit 1
          fi
          # Mirrors app/build.gradle.kts' own `versionBuild + 1`. Kept in sync by the assertion in
          # the build step below, which fails the run if Gradle ends up building something else.
          FLOOR="$(awk -F= '/^versionBuild/ {gsub(/[^0-9]/, "", $2); print $2 + 1}' version.properties)"
          if [ -z "$FLOOR" ]; then
            echo "::error::Could not read versionBuild out of version.properties."
            exit 1
          fi
          # Keep the service-account JSON off disk except while the script needs it.
          SA_JSON="$(mktemp)"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$SA_JSON"
          trap 'rm -f "$SA_JSON"' EXIT
          # stdout is the integer and nothing else in this mode; the ::notice:: lines go to stderr.
          CODE="$(python .github/scripts/publish_play.py \
            --package com.hereliesaz.graffux \
            --sa-json "$SA_JSON" \
            --floor "$FLOOR" \
            --print-next-version-code)"
          case "$CODE" in
            ''|*[!0-9]*)
              echo "::error::Expected an integer versionCode, got '$CODE'."
              exit 1
              ;;
          esac
          echo "Building versionCode $CODE (floor $FLOOR)"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB
        id: build
        # Explicit, not incidental: GitHub's DEFAULT shell for `run:` steps is `bash -e {0}`
        # with no `-o pipefail` — only `shell: bash` adds it. This step pipes through `tee`,
        # so without this a Gradle failure would leave the pipeline's exit status as tee's
        # (0), and the step would report success on a build that actually failed.
        shell: bash
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Empty when the "Determine next versionCode" step was skipped (publish: false), in
          # which case the build falls back to version.properties exactly as it always did.
          NEXT_VERSION_CODE: ${{ steps.nextcode.outputs.version_code }}
        run: |
          OVERRIDE=""
          if [ -n "$NEXT_VERSION_CODE" ]; then
            OVERRIDE="-PversionCodeOverride=$NEXT_VERSION_CODE"
          fi
          # $OVERRIDE is deliberately unquoted so an empty value expands to no argument at all;
          # it is a single shell word by construction, so there is nothing to split badly.
          ./gradlew bundleRelease $OVERRIDE | tee build.log
          # app/build.gradle.kts prints this at configuration time for exactly this purpose — see
          # its comment. Feeds publish_play.py's pre-publish versionCode check below.
          CODE="$(grep -o 'GRAFFUX_VERSION_CODE=[0-9]*' build.log | tail -n1 | cut -d= -f2)"
          if [ -z "$CODE" ]; then
            echo "::error::Could not read GRAFFUX_VERSION_CODE out of the build log."
            exit 1
          fi
          # The override is only useful if AGP actually honoured it. Gradle's configuration cache
          # would skip the println above (see app/build.gradle.kts) and leave a stale number here,
          # so assert rather than trust: publishing a versionCode the AAB does not contain would
          # be a far more confusing failure than this one.
          if [ -n "$NEXT_VERSION_CODE" ] && [ "$CODE" != "$NEXT_VERSION_CODE" ]; then
            echo "::error::Asked Gradle for versionCode $NEXT_VERSION_CODE but it built $CODE."
            exit 1
          fi
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Publish runs by default (including on push) so a build that doesn't actually push FAILS the job —
      # a green check means it reached Play. Skip only by explicitly dispatching with publish: false.
      #
      # One AAB, one Edit, whatever tracks TARGETS in publish_play.py names (internal + alpha
      # today — see the note near the top of this file). internal goes live (status=completed)
      # so testers see it immediately; alpha is staged as a draft, ready to promote by hand in
      # the Play Console. `.github/scripts/publish_play.py` opens a single Edit, uploads once,
      # releases to every track in TARGETS, and commits — because Play rejects re-uploading the
      # same versionCode, this is the only way to hand one bundle to more than one track.
      # publish_play.py exits 0 = every track ok, 2 = internal published but ≥1
      # other track failed (versionCode still consumed by Play), 1 = nothing published.
      # This step has no explicit `shell:`, so it runs under GitHub's default `bash -e {0}` —
      # `-e` alone (no pipe here, so pipefail is moot) would still kill the step on the
      # python call's exit 2 before `$?` can be read below. Disable errexit around the call to
      # actually reach it.
      - name: Publish to Google Play (internal + alpha draft; roll out in console)
        id: publish
        if: ${{ inputs.publish != 'false' }}
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Dependencies are installed by the "Install Play API client" step above, which the
          # versionCode query also depends on.
          #
          # An unset secret reaches the script as an empty file and surfaces as a JSON parse
          # error, which reads like a corrupt key rather than a missing one. Distinguish them
          # here: this branch means the secret does not exist (or is not exposed to this run),
          # not that its contents are wrong.
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON//[[:space:]]/}" ]; then
            echo "::error::Repository secret PLAY_SERVICE_ACCOUNT_JSON is empty or not set. Add it under Settings > Secrets and variables > Actions with the full service-account key JSON."
            exit 1
          fi
          SCRIPT=.github/scripts/publish_play.py
          # Fail loudly on a missing script. Python exits 2 for "can't open file", which is the
          # same code this workflow reads as "internal published, drafts failed" — so without
          # this guard a rename or a typo reports a successful publish that never happened.
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT is missing — nothing was published."
            exit 1
          fi
          # Keep the service-account JSON off disk except while the script needs it.
          SA_JSON="$(mktemp)"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$SA_JSON"
          trap 'rm -f "$SA_JSON"' EXIT
          AAB="$(ls app/build/outputs/bundle/release/*.aab | head -n1)"
          set +e
          python "$SCRIPT" \
            --package com.hereliesaz.graffux \
            --aab "$AAB" \
            --sa-json "$SA_JSON" \
            --version-code "${{ steps.build.outputs.version_code }}"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          # Only 0 (all tracks) and 2 (internal live, some drafts missing) are outcomes the
          # script means. Anything else is the script failing to run at all, and must not be
          # mistaken for one of them.
          if [ "$CODE" != "0" ] && [ "$CODE" != "2" ]; then
            echo "::error::Play publish exited $CODE — nothing was published."
            exit 1
          fi

      # Turn the job red on partial success so real Play failures stay visible.
      # (This no longer strands the versionCode. The number is derived from what Play currently
      # has, so a run that failed before publishing leaves Play untouched and the next run picks
      # the same free code again; a run that got as far as staging `internal` has moved Play's
      # highest, so the next run picks the one after it. Either way a retry needs no commit.)
      - name: Fail the job if any track was not staged
        if: steps.publish.outputs.exit_code == '2'
        run: |
          echo "::error::Play publish completed for internal but at least one draft track failed. See the earlier warning for which tracks need to be initialised in the Play Console."
          exit 1
