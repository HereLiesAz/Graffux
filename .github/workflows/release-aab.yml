name: Release AAB to Play

# Builds a signed Android App Bundle and (optionally) publishes it to Google Play.
#
# Required repository secrets:
#   Signing (same ones used by release-apk.yml):
#     KEYSTORE_PRIVATE   - PEM private key for the upload key
#     KEYSTORE_CHAIN     - PEM certificate chain for the upload key
#     KEYSTORE_PASSWORD  - keystore password
#     KEY_ALIAS          - key alias
#     KEY_PASSWORD       - key password
#   Play publishing:
#     PLAY_SERVICE_ACCOUNT_JSON - the full JSON of a Google Cloud service account that has been
#       granted release permissions in the Play Console (Users & permissions). See SETUP below.
#
# SETUP (one-time):
#   1. Play Console → create the app, then enroll in Play App Signing (default). Sign with the
#      upload key above; Google holds the app-signing key.
#   2. Google Cloud Console → create a service account, create a JSON key, paste the JSON into the
#      PLAY_SERVICE_ACCOUNT_JSON secret. In the Play Console, invite that service account and grant
#      it "Release to testing tracks" (and Production if you intend to publish there).
#      Three things have to line up or every API call fails with 403 "The caller does not have
#      permission" even though the key authenticates fine — the secret is not the problem when
#      that happens, the grant is:
#        a. the service account is an accepted user in Play Console → Users & permissions, with
#           app access to com.hereliesaz.graffux (a pending invitation is not access);
#        b. the service account's GCP project is the one linked under Play Console → Setup →
#           API access (a key from any other project authenticates and is then refused);
#        c. the Google Play Android Developer API is enabled in that same GCP project.
#      publish_play.py prints the account and project it is using, and spells out this list on
#      a 403, so the run log names the identity that was rejected.
#   3. FIRST UPLOAD MUST BE MANUAL: Google's API cannot create the very first release for a new app.
#      Upload one AAB by hand in the Play Console once; after that this workflow can publish.
#   4. Create at least one release in each of the alpha (closed testing), beta (open testing), and
#      production tracks by hand — the Play API can only add releases to tracks that already exist.
#
# Publishing rollout: one AAB, one Play Edit, four tracks. `internal` goes live (status=completed);
# `alpha`/`beta`/`production` are staged as drafts, ready to promote by hand in the Play Console.
# Implemented in `.github/scripts/publish_play.py` because Play rejects re-uploading the same
# versionCode, so a single Edit is the only way to hand one bundle to multiple tracks.
#
# versionCode tracks the committed version.properties, not this job or this commit — see
# "versionCode and Play publishing" in CLAUDE.md for why, and why that means a merge without a
# version.properties bump can strand it. The pre-publish check below (`publish_play.py
# --version-code`) fails fast with a clear message if that's happened, instead of a raw Play 403.

on:
  # Publish ONLY from main (plus manual dispatch). Publishing on every branch push staged whichever
  # branch built last as the Play draft and burned Google's daily edit-commit quota ("Daily save quota
  # exceeded"), so the newest AAB often never landed. Restricting to main means the staged draft is
  # always the latest merged build, and there are few enough commits that the quota holds.
  push:
    branches: [main]
    paths-ignore:
      - version.properties
  workflow_dispatch:
    inputs:
      publish:
        default: true
        description: "Push the AAB to Play (false = build only)"

# Serialize Play publishes across ALL refs: the Play API allows only one open Edit per app, so two
# release-aab runs publishing at once (e.g. a merge to main overlapping a branch push) collide with
# "A change was made to the application outside of this Edit". Queue them (don't cancel a publish
# mid-flight) so each completes before the next starts.
concurrency:
  group: google-play-publish
  cancel-in-progress: false

# Least privilege: builds the AAB, uploads it as an artifact, and publishes to Google Play via the
# Play API (PLAY_SERVICE_ACCOUNT_JSON). It does not write back to the repo, so read is enough.
# NOTE: this `read` is exactly why versionCode doesn't self-advance between runs — see the
# versionCode comment above. If this job ever needs `contents: write` for something else, revisit
# that behavior at the same time: it stops being true the moment this job can commit.
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Generate keystore from secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_PRIVATE" > private_key.pem
          echo "$KEYSTORE_CHAIN" > certificate_chain.crt
          openssl pkcs12 -export -in certificate_chain.crt -inkey private_key.pem \
            -name "$KEY_ALIAS" -out keystore.p12 \
            -password pass:"$KEYSTORE_PASSWORD"
          keytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 \
            -destkeystore app/keystore.jks -deststoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" -noprompt
          rm private_key.pem certificate_chain.crt keystore.p12

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed AAB
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease | tee build.log
          # app/build.gradle.kts prints this at configuration time for exactly this purpose — see
          # its comment. Feeds publish_play.py's pre-publish versionCode check below.
          CODE="$(grep -o 'GRAFFUX_VERSION_CODE=[0-9]*' build.log | tail -n1 | cut -d= -f2)"
          if [ -z "$CODE" ]; then
            echo "::error::Could not read GRAFFUX_VERSION_CODE out of the build log."
            exit 1
          fi
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Publish runs by default (including on push) so a build that doesn't actually push FAILS the job —
      # a green check means it reached Play. Skip only by explicitly dispatching with publish: false.
      #
      # One AAB, four tracks, one Edit: internal goes live (status=completed) so testers see it
      # immediately; alpha (closed testing), beta (open testing), and production are staged as
      # drafts, ready to promote by hand in the Play Console. `.github/scripts/publish_play.py`
      # opens a single Edit, uploads once, releases to all four tracks, and commits — because
      # Play rejects re-uploading the same versionCode, this is the only way to hand one bundle
      # to multiple tracks in one shot.
      - name: Set up Python
        if: ${{ inputs.publish != 'false' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # publish_play.py exits 0 = every track ok, 2 = internal published but ≥1
      # other track failed (versionCode still consumed by Play), 1 = nothing published.
      # GitHub Actions runs bash with `-eo pipefail`, so we have to disable errexit
      # around the python call to actually reach `$?` — otherwise `-e` kills the step
      # on exit 2 before we can capture the code for the "Fail if any track was not
      # staged" step below.
      - name: Publish to Google Play (internal + alpha/beta/production drafts; roll out in console)
        id: publish
        if: ${{ inputs.publish != 'false' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # These are what publish_play.py actually imports. Installing google-auth alone left
          # googleapiclient/httplib2 missing, which — combined with the swallowed exit code
          # below — is how this step reported success while publishing nothing.
          python -m pip install --quiet \
            google-auth==2.35.0 \
            google-api-python-client==2.149.0 \
            google-auth-httplib2==0.2.0 \
            httplib2==0.22.0
          # An unset secret reaches the script as an empty file and surfaces as a JSON parse
          # error, which reads like a corrupt key rather than a missing one. Distinguish them
          # here: this branch means the secret does not exist (or is not exposed to this run),
          # not that its contents are wrong.
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON//[[:space:]]/}" ]; then
            echo "::error::Repository secret PLAY_SERVICE_ACCOUNT_JSON is empty or not set. Add it under Settings > Secrets and variables > Actions with the full service-account key JSON."
            exit 1
          fi
          SCRIPT=.github/scripts/publish_play.py
          # Fail loudly on a missing script. Python exits 2 for "can't open file", which is the
          # same code this workflow reads as "internal published, drafts failed" — so without
          # this guard a rename or a typo reports a successful publish that never happened.
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT is missing — nothing was published."
            exit 1
          fi
          # Keep the service-account JSON off disk except while the script needs it.
          SA_JSON="$(mktemp)"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$SA_JSON"
          trap 'rm -f "$SA_JSON"' EXIT
          AAB="$(ls app/build/outputs/bundle/release/*.aab | head -n1)"
          set +e
          python "$SCRIPT" \
            --package com.hereliesaz.graffux \
            --aab "$AAB" \
            --sa-json "$SA_JSON" \
            --version-code "${{ steps.build.outputs.version_code }}"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          # Only 0 (all tracks) and 2 (internal live, some drafts missing) are outcomes the
          # script means. Anything else is the script failing to run at all, and must not be
          # mistaken for one of them.
          if [ "$CODE" != "0" ] && [ "$CODE" != "2" ]; then
            echo "::error::Play publish exited $CODE — nothing was published."
            exit 1
          fi

      # Turn the job red on partial success so real Play failures stay visible.
      # (This DOES strand the versionCode: it's tied to the committed version.properties, not to
      # this run, so a red X here — or any other run that never gets to publish — leaves the same
      # number for the next run to retry. That's fine for THIS failure mode, since Play already has
      # `internal` at this versionCode and a retry would collide on it anyway; but if the run instead
      # failed before publishing at all, nothing advances until some commit bumps version.properties'
      # versionBuild. See the versionCode note near the top of this file.)
      - name: Fail the job if any track was not staged
        if: steps.publish.outputs.exit_code == '2'
        run: |
          echo "::error::Play publish completed for internal but at least one draft track failed. See the earlier warning for which tracks need to be initialised in the Play Console."
          exit 1
