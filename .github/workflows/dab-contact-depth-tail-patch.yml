name: Dab Contact Depth Compatibility Patch

on:
  push:
    branches: [ "feat/substrate-deposition-core" ]
    paths: [ ".github/workflows/dab-contact-depth-tail-patch.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/substrate-deposition-core

      - name: Preserve positional Dab compatibility
        run: python scripts/patch_dab_contact_depth_tail.py

      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/engine/src/commonMain/kotlin/com/hereliesaz/graffitixr/common/azphalt/BrushStamps.kt
          git diff --cached --check
          git commit -m "paint: preserve positional Dab compatibility"
          git push origin HEAD:feat/substrate-deposition-core
