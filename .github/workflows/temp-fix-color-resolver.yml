name: Temp Fix Color Resolver

on:
  push:
    branches:
      - feat/krita-color-source-mix
    paths:
      - .github/workflows/temp-fix-color-resolver.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/krita-color-source-mix
          fetch-depth: 0
      - name: Fix stale resolver call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt')
          text = p.read_text()
          old = 'colorArgb = StampBrushRenderer.resolvedColor(colorArgb, dab),'
          new = 'colorArgb = StampBrushRenderer.resolvedColor(\n                                colorArgb, _uiState.value.secondaryColor.toArgb(), stampBrush, dab,\n                            ),'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale resolvedColor call, found {count}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/temp-fix-color-resolver.yml
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Vulkan color source resolution"
          git push origin HEAD:feat/krita-color-source-mix
