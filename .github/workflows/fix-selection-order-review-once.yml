name: Fix Selection Order Review Once
on:
  push:
    branches: [feat/selection-rail-order]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/selection-rail-order
      - run: python3 tools/fix_selection_order_review.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/hereliesaz/graffux/MainActivity.kt
          git commit -m 'fix(editor): preserve selection rail relative order'
          git push
