name: Engine 2 Convergence Once
on:
  push:
    branches: [perf/azphalt-engine-2-convergence]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'integrate lossless input and latency telemetry')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/azphalt-engine-2-convergence
      - run: python3 tools/engine2_convergence_patch.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git commit -m 'perf(brush): integrate lossless input and latency telemetry'
          git push
