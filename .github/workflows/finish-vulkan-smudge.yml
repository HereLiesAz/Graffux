name: Finish Vulkan Smudge integration

on:
  push:
    branches: [feat/krita-finish]
    paths:
      - scripts/finish_vulkan_smudge.py
      - .github/workflows/finish-vulkan-smudge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/krita-finish
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply source integration
        run: python scripts/finish_vulkan_smudge.py
      - name: Remove patch machinery
        run: rm scripts/finish_vulkan_smudge.py .github/workflows/finish-vulkan-smudge.yml
      - name: Commit integrated sources
        run: |
          git config user.name "Az"
          git config user.email "103241502+HereLiesAz@users.noreply.github.com"
          git add -A
          git commit -m "Integrate persistent Vulkan Color Smudge"
          git push origin HEAD:feat/krita-finish
