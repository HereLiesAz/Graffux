name: Build

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-empty-stroke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch zero-point catch-up crash
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt')
          s = path.read_text()
          old = '''            val catchUpPoints = snapshotStrokePoints()
            val catchUpPressures = snapshotStrokePressures()
            val mappedAll = ImageProcessor.mapScreenToBitmap(
'''
          new = '''            val catchUpPoints = snapshotStrokePoints()
            val catchUpPressures = snapshotStrokePressures()
            if (generation != strokeGeneration || strokeLayerId != layerId || catchUpPoints.isEmpty()) {
                gpuEngine?.destroy()
                workBitmap.recycle()
                return@launch
            }
            val mappedAll = ImageProcessor.mapScreenToBitmap(
'''
          if old not in s:
              raise SystemExit(0)
          s = s.replace(old, new, 1)
          old2 = '''                layerScale, layerOffset, layerRotationZ
            )

            val bw = workBitmap.width.toFloat()
'''
          new2 = '''                layerScale, layerOffset, layerRotationZ
            )
            if (mappedAll.isEmpty()) {
                gpuEngine?.destroy()
                workBitmap.recycle()
                return@launch
            }

            val bw = workBitmap.width.toFloat()
'''
          if old2 not in s:
              raise SystemExit('mappedAll anchor not found')
          path.write_text(s.replace(old2, new2, 1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'Az'
          git config user.email '103241502+HereLiesAz@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git commit -m 'Fix empty live-stroke catch-up [skip ci]'
          git push origin HEAD:main

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build (unit tests + debug APK)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --continue --build-cache
