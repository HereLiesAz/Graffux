name: Build

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Reads the repo and runs tests/build only — no pushes, no releases, no issue writes. Without
# this block every other workflow in the repo declares one explicitly, this job silently
# inherits the repository/org default token permissions, which can be far broader than it needs
# (historically write-all on repos configured for "Read and write permissions").
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # OpenCV (Java + native via Prefab) is a plain Maven Central dependency now — Gradle resolves
      # it during the build, so there is nothing to fetch or vendor here.

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build (unit tests + debug APK)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --continue --build-cache
