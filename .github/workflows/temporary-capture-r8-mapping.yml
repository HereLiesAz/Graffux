name: Temporary Capture R8 Mapping

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          dependency-graph: disabled

      - name: Build release mapping
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease
          test -f app/build/outputs/mapping/release/mapping.txt

      - name: Upload R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: graffux-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 1
