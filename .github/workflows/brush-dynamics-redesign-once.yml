name: Brush Dynamics Redesign Once
on:
  push:
    branches: [feat/brush-dynamics-controls]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'redesign Brush Studio dynamics controls')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/brush-dynamics-controls
      - run: python3 tools/brush_dynamics_redesign.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/BrushStudioWindow.kt
          git commit -m 'feat(brush): redesign Brush Studio dynamics controls'
          git push
