name: Vulkan Contact Depth Forwarding Patch

on:
  push:
    branches: [ "feat/substrate-vulkan-parity" ]
    paths:
      - "scripts/patch_vulkan_contact_depth_forwarding.py"
      - ".github/workflows/vulkan-contact-depth-forwarding-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/substrate-vulkan-parity

      - name: Apply guarded contact-depth forwarding
        run: python3 scripts/patch_vulkan_contact_depth_forwarding.py

      - name: Validate exact product diff
        run: |
          git diff --check
          test "$(git diff --name-only | grep -v '^$')" = "feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt"

      - name: Commit fix and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git commit -m "feat: forward resolved contact depth to Vulkan dabs"
          git rm scripts/patch_vulkan_contact_depth_forwarding.py .github/workflows/vulkan-contact-depth-forwarding-patch.yml
          git commit -m "chore: remove temporary contact-depth patch machinery"
          git push origin HEAD:feat/substrate-vulkan-parity
