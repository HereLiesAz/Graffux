name: Substrate Vulkan Validation

on:
  push:
    branches: [ "feat/substrate-vulkan-parity" ]
    paths: [ ".github/workflows/substrate-vulkan-validation.yml" ]

permissions:
  contents: read

jobs:
  validate-vulkan-substrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/substrate-vulkan-parity

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true
          dependency-graph: disabled

      - name: Compile shaders and native engine
        run: |
          chmod +x gradlew
          ./gradlew :core:nativebridge:externalNativeBuildDebug --stacktrace

      - name: Compile nativebridge instrumentation tests
        run: ./gradlew :core:nativebridge:compileDebugAndroidTestKotlin --stacktrace

      - name: Compile editor callers
        run: ./gradlew :feature:editor:compileDebugKotlin --stacktrace

      - name: Run CPU substrate regression slice
        run: |
          ./gradlew :feature:editor:testDebugUnitTest \
            --tests "*StampBrushSubstrateRendererTest" \
            --tests "*DrawingEngineSubstrateTest" \
            --stacktrace

# Temporary branch-only validator; remove before merge.
