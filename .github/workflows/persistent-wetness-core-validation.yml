name: Persistent Wetness Core Validation

on:
  push:
    branches: [ "feat/persistent-wetness-core" ]
    paths:
      - "core/engine/src/commonMain/kotlin/com/hereliesaz/graffitixr/common/azphalt/PersistentWetnessField.kt"
      - "core/engine/src/commonTest/kotlin/com/hereliesaz/graffitixr/common/azphalt/PersistentWetnessFieldTest.kt"
      - ".github/workflows/persistent-wetness-core-validation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true
          dependency-graph: disabled
      - name: Run persistent wetness tests
        run: |
          chmod +x gradlew
          ./gradlew :core:engine:desktopTest --tests "*PersistentWetnessFieldTest" --stacktrace
