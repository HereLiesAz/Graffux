name: Substrate Vulkan Init Order Fix

on:
  push:
    branches: [ "feat/substrate-vulkan-parity" ]
    paths:
      - "scripts/fix_substrate_vulkan_init_order.py"
      - ".github/workflows/substrate-vulkan-init-order-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/substrate-vulkan-parity

      - name: Apply guarded init-order fix
        run: python3 scripts/fix_substrate_vulkan_init_order.py

      - name: Validate exact product diff
        run: |
          git diff --check
          test "$(git diff --name-only | grep -v '^$')" = "core/nativebridge/src/main/cpp/VulkanStampEngine.cpp"

      - name: Commit fix and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/nativebridge/src/main/cpp/VulkanStampEngine.cpp
          git commit -m "fix: allocate Vulkan commands before substrate texture upload"
          git rm scripts/fix_substrate_vulkan_init_order.py .github/workflows/substrate-vulkan-init-order-fix.yml
          git commit -m "chore: remove temporary Vulkan init-order patch machinery"
          git push origin HEAD:feat/substrate-vulkan-parity
