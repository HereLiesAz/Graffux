name: Apply ChatGPT rail polish

on:
  push:
    branches: [ "chatgpt/rail-polish-20260827" ]
    paths:
      - ".github/scripts/apply_rail_polish.py"

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply targeted UI patch
        run: python3 .github/scripts/apply_rail_polish.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --continue --build-cache

      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email '103241502+HereLiesAz@users.noreply.github.com'
          git rm .github/scripts/apply_rail_polish.py .github/workflows/chatgpt-rail-polish.yml
          git add app/src/main/java/com/hereliesaz/graffux/MainActivity.kt app/src/main/java/com/hereliesaz/graffux/ToolCatalog.kt version.properties
          git commit -m 'Polish rail interactions and add dockable area rails [skip ci]'
          git push origin HEAD:chatgpt/rail-polish-20260827
