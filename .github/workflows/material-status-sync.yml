name: Material Status Sync

on:
  push:
    branches: [ "docs/material-status-sync" ]
    paths: [ ".github/workflows/material-status-sync.yml" ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/material-status-sync

      - name: Apply guarded status sync
        run: python scripts/sync_material_status.py

      - name: Commit status sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/Material-Aware Paint Engine Implementation Status.md"
          git diff --cached --check
          git commit -m "docs: sync material engine implementation status"
          git push origin HEAD:docs/material-status-sync
