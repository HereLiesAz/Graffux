name: Clean symmetry icon comments once
on:
  push:
    branches: [main]
    paths:
      - 'tools/clean_symmetry_icon_comments.py'
      - '.github/workflows/clean-symmetry-comments-once.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python tools/clean_symmetry_icon_comments.py
      - run: |
          rm -f tools/clean_symmetry_icon_comments.py .github/workflows/clean-symmetry-comments-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(design): clean stale symmetry icon comments'
          git push origin HEAD:main
