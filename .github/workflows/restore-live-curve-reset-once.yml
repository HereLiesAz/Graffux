name: Restore Live Curve Reset Once
on:
  push:
    branches: [perf/azphalt-engine-2-convergence]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'restore Basic live curve reset helper')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/azphalt-engine-2-convergence
      - run: python3 tools/restore_live_curve_reset.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git commit -m 'fix(brush): restore Basic live curve reset helper'
          git push
