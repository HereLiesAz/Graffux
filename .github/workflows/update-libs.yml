name: Update Dependencies

on:
  workflow_dispatch:

# Least-privilege default token; jobs needing more declare their own permissions block.
permissions:
  contents: read

jobs:
  update-libs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch to dependencies branch
        run: |
          # Check if remote branch exists
          if git ls-remote --exit-code --heads origin dependencies; then
            git checkout dependencies
            git pull origin dependencies
          else
            git checkout --orphan dependencies
            git rm -rf .
          fi

      - name: Create libs directory
        run: mkdir -p libs

      # OpenCV is no longer vendored here — it's imported from Maven Central (org.opencv:opencv,
      # Java + native via Prefab). Bump its version in gradle/libs.versions.toml instead.

      - name: Download GLM
        env:
          GLM_VERSION: 1.0.1
          # Pinned via `git ls-remote --tags https://github.com/g-truc/glm refs/tags/$GLM_VERSION`.
          # Verifying the resolved commit SHA, not a zip checksum: a git tag can be force-moved by
          # upstream, so this doesn't guard against that — but it IS a stronger integrity check
          # than hashing GitHub's tag-archive .zip, which GitHub does not guarantee is byte-stable
          # over time (regenerated archives can compress differently). A commit SHA is
          # cryptographically derived from its tree content, so a mismatch here means the tag
          # moved or the fetch was tampered with, either way worth stopping for.
          GLM_COMMIT: 0af55ccecd98d4e5a8d1fad7de25ba429d60e863
        run: |
          echo "Fetching GLM ${GLM_VERSION}..."
          rm -rf libs/glm glm-src
          git clone --quiet --depth 1 --branch "$GLM_VERSION" https://github.com/g-truc/glm glm-src
          ACTUAL_COMMIT="$(git -C glm-src rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$GLM_COMMIT" ]; then
            echo "::error::GLM tag $GLM_VERSION resolved to $ACTUAL_COMMIT, expected $GLM_COMMIT — the tag moved since this was pinned. Refusing to vendor unverified source; update GLM_COMMIT above only after reviewing what changed."
            exit 1
          fi
          mkdir -p libs/glm
          mv glm-src/glm libs/glm/glm
          rm -rf glm-src

      # This step does NOT download LiteRT — there's no pinned URL for it yet. It only leaves a
      # placeholder so `libs/litert` exists and says why. Keep it that way in both the step name
      # and the commit message below: a past version of this step wrote the same placeholder but
      # committed it under "Update dependencies: GLM, LiteRT", which reads as a real update and
      # isn't one.
      - name: Create LiteRT placeholder (not actually downloaded)
        env:
          LITERT_VERSION: 2.1.0
        run: |
          rm -rf libs/litert
          mkdir -p libs/litert
          echo "LiteRT version ${LITERT_VERSION}" > libs/litert/README.md
          echo "Not downloaded by this workflow — no pinned URL is configured yet. Populate this directory by hand or add a real fetch step with a checksum/commit pin, matching the GLM step above." >> libs/litert/README.md

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add libs
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update GLM dependency (LiteRT placeholder unchanged — see libs/litert/README.md)"
            git push origin dependencies
          else
            echo "No changes to commit."
          fi
