name: Delete obsolete fix branch

on:
  push:
    branches: [fix/arraydeque-live-curve-race]

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Delete obsolete branch
        run: git push origin --delete fix/arraydeque-live-curve-race
