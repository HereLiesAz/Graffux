name: Apply ArrayDeque race fix

on:
  push:
    branches: [fix/arraydeque-live-curve-race]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[arraydeque-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/arraydeque-live-curve-race
          fetch-depth: 0

      - name: Patch live curve stroke state race
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt')
          s = path.read_text()

          old = '''    private val liveCurveWindow = ArrayDeque<Offset>()
              private val liveCurveWidths = ArrayDeque<Float>()
              /** How many segments the live window has drawn so far this stroke — 0 means the window hasn't
          '''.replace('              ', '')
          new = '''    private val liveCurveLock = Any()
          private val liveCurveWindow = ArrayDeque<Offset>()
          private val liveCurveWidths = ArrayDeque<Float>()
          /** How many segments the live window has drawn so far this stroke — 0 means the window hasn't
          '''
          if old not in s:
              raise SystemExit('live curve field anchor not found')
          s = s.replace(old, new, 1)

          old = '''    private var liveCurveFinalizedCount = 0
              // Incremental brush dynamics for the live stroke; same recursion the commit/replay paths run
          '''.replace('              ', '')
          new = '''    private var liveCurveFinalizedCount = 0
          @Volatile private var strokeGeneration = 0L
          // Incremental brush dynamics for the live stroke; same recursion the commit/replay paths run
          '''
          if old not in s:
              raise SystemExit('generation field anchor not found')
          s = s.replace(old, new, 1)

          old = '''        val originalBitmap = layer.bitmap ?: return

              liveCurveWindow.clear()
              liveCurveWidths.clear()
              liveCurveFinalizedCount = 0
          '''.replace('              ', '')
          new = '''        val originalBitmap = layer.bitmap ?: return

          val generation = ++strokeGeneration
          resetLiveCurveState()
          '''
          if old not in s:
              raise SystemExit('stroke start reset anchor not found')
          s = s.replace(old, new, 1)

          old = '''            val workBitmap = SafeBitmap.copy(originalBitmap) ?: return@launch
              val workCanvas = Canvas(workBitmap)
          '''.replace('              ', '')
          new = '''            val workBitmap = SafeBitmap.copy(originalBitmap) ?: return@launch
          if (generation != strokeGeneration || strokeLayerId != layerId) {
              workBitmap.recycle()
              return@launch
          }
          val workCanvas = Canvas(workBitmap)
          '''
          if old not in s:
              raise SystemExit('background setup anchor not found')
          s = s.replace(old, new, 1)

          old = '''                    feedLiveCurvePoint(
                          workCanvas, paint, workBitmap.width, workBitmap.height, strokeSymmetry,
                          state.wrapAroundMode, mappedAll[0], 0f, workBitmap,
                      )
                      for (i in 1 until mappedAll.size) {
                          val p = catchUpPressures.getOrNull(i) ?: 1f
                          val width = dyn.next((mappedAll[i] - mappedAll[i - 1]).getDistance(), brushSize * brushScale, p)
                          feedLiveCurvePoint(
                              workCanvas, paint, workBitmap.width, workBitmap.height, strokeSymmetry,
                              state.wrapAroundMode, mappedAll[i], width, workBitmap,
                          )
                      }
          '''.replace('                      ', '')
          new = '''                    if (generation != strokeGeneration || strokeLayerId != layerId) return@launch
          feedLiveCurvePoint(
              workCanvas, paint, workBitmap.width, workBitmap.height, strokeSymmetry,
              state.wrapAroundMode, mappedAll[0], 0f, workBitmap,
          )
          for (i in 1 until mappedAll.size) {
              if (generation != strokeGeneration || strokeLayerId != layerId) return@launch
              val p = catchUpPressures.getOrNull(i) ?: 1f
              val width = dyn.next((mappedAll[i] - mappedAll[i - 1]).getDistance(), brushSize * brushScale, p)
              feedLiveCurvePoint(
                  workCanvas, paint, workBitmap.width, workBitmap.height, strokeSymmetry,
                  state.wrapAroundMode, mappedAll[i], width, workBitmap,
              )
          }
          '''
          if old not in s:
              raise SystemExit('catch-up loop anchor not found')
          s = s.replace(old, new, 1)

          old = '''            withContext(dispatchers.main) {
                  strokeWorkingBitmap = workBitmap
                  strokeWorkingCanvas = workCanvas
          '''.replace('                  ', '')
          new = '''            withContext(dispatchers.main) {
              if (generation != strokeGeneration || strokeLayerId != layerId) {
                  gpuEngine?.destroy()
                  workBitmap.recycle()
                  return@withContext
              }
              strokeWorkingBitmap = workBitmap
              strokeWorkingCanvas = workCanvas
          '''
          if old not in s:
              raise SystemExit('adoption anchor not found')
          s = s.replace(old, new, 1)

          old = '''    private fun feedLiveCurvePoint(
          '''
          new = '''    private fun resetLiveCurveState() = synchronized(liveCurveLock) {
          liveCurveWindow.clear()
          liveCurveWidths.clear()
          liveCurveFinalizedCount = 0
          }

          private fun feedLiveCurvePoint(
          '''
          if old not in s:
              raise SystemExit('feed function anchor not found')
          s = s.replace(old, new, 1)

          old = '''    ) {
              if (liveCurveWindow.isNotEmpty()) liveCurveWidths.addLast(width)
              liveCurveWindow.addLast(point)
              if (liveCurveWindow.size < 4) return
          '''.replace('              ', '')
          new = '''    ) = synchronized(liveCurveLock) {
          if (liveCurveWindow.isNotEmpty()) liveCurveWidths.addLast(width)
          liveCurveWindow.addLast(point)
          if (liveCurveWindow.size < 4) return@synchronized
          '''
          if old not in s:
              raise SystemExit('feed body anchor not found')
          s = s.replace(old, new, 1)

          old = '''        liveCurveWindow.clear()
              liveCurveWidths.clear()
              liveCurveFinalizedCount = 0
              resetStrokePoints()
          '''.replace('              ', '')
          new = '''        strokeGeneration++
          resetLiveCurveState()
          resetStrokePoints()
          '''
          if old not in s:
              raise SystemExit('transient reset anchor not found')
          s = s.replace(old, new, 1)

          path.write_text(s)
          PY

          git config user.name 'Az'
          git config user.email '103241502+HereLiesAz@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git commit -m 'Fix live brush curve ArrayDeque race [arraydeque-fix-applied]'
          git push origin HEAD:fix/arraydeque-live-curve-race
