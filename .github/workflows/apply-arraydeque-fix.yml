name: Delete obsolete fix branch

on:
  push:
    branches: [fix/arraydeque-live-curve-race]

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branch
        run: git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git --delete fix/arraydeque-live-curve-race
