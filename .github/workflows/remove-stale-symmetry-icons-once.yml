name: Remove stale symmetry icons once
on:
  push:
    branches: [main]
    paths:
      - 'tools/remove_stale_symmetry_icons.py'
      - '.github/workflows/remove-stale-symmetry-icons-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove stale symmetry icon exports
        run: python tools/remove_stale_symmetry_icons.py
      - name: Commit cleanup and remove one-shot files
        run: |
          rm -f tools/remove_stale_symmetry_icons.py .github/workflows/remove-stale-symmetry-icons-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(design): remove stale symmetry icon exports'
          git push origin HEAD:main
