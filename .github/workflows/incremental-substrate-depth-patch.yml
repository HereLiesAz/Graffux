name: Incremental Substrate Depth Patch

on:
  push:
    branches: [ "feat/substrate-deposition-core" ]
    paths: [ ".github/workflows/incremental-substrate-depth-patch.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/substrate-deposition-core

      - name: Apply incremental contact-depth parity patch
        run: python scripts/patch_incremental_substrate_depth.py

      - name: Commit parity patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/engine/src/commonMain/kotlin/com/hereliesaz/graffitixr/common/azphalt/IncrementalDynamicDabGenerator.kt \
            core/engine/src/commonTest/kotlin/com/hereliesaz/graffitixr/common/azphalt/BrushMorphologyDabParityTest.kt
          git diff --cached --check
          git commit -m "paint: preserve live substrate contact-depth parity"
          git push origin HEAD:feat/substrate-deposition-core
