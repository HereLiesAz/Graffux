name: Physical Population UI Patch

on:
  push:
    branches: ["ci/m2-physical-bristle-population"]
    paths: [".github/workflows/physical-population-ui-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/m2-physical-bristle-population
          fetch-depth: 0
      - name: Apply exact edits
        run: python3 scripts/physical_population_patch.py
      - name: Commit exact edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire physical brush live routing and hover [skip ci]"
          git push origin HEAD:ci/m2-physical-bristle-population
