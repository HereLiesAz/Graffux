name: Remove Symmetry Once
on:
  push:
    branches: [feat/remove-symmetry]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'remove mirror symmetry feature')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/remove-symmetry
      - run: python3 tools/remove_symmetry_feature.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(editor): remove mirror symmetry feature'
          git push
