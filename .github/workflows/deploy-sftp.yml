name: Deploy over FTP

# Mirror the built site to your own host over SFTP (SSH file transfer).
# Runs on every push to main, and can be fired by hand from the Actions
# tab. Uses lftp's built-in SFTP implementation - not OpenSSH - because
# ProFTPD mod_sftp/0.9.9's password auth is incompatible with sshpass.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sftp-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/
          destination: ./_site
        
      - name: Deploy via lftp (SFTP)
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PORT: ${{ vars.SFTP_PORT || '22' }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR || '/graffux' }}
        run: |
          set -e
          sudo apt-get install -y lftp

          USER_TRIMMED=$(printf '%s' "$USERNAME" | tr -d ' \t\r\n')
          PW_TRIMMED=$(printf '%s' "$PASSWORD" | tr -d '\r\n')
          echo "[diag] username length raw=$(printf '%s' "$USERNAME" | wc -c) trimmed=$(printf '%s' "$USER_TRIMMED" | wc -c)"
          echo "[diag] password length raw=$(printf '%s' "$PASSWORD" | wc -c) trimmed=$(printf '%s' "$PW_TRIMMED" | wc -c)"
          echo "[diag] host: $(printf '%s' "$HOST" | wc -c) chars, port: $PORT"

          # lftp has its own SFTP implementation (not OpenSSH) which
          # handles ProFTPD mod_sftp password auth reliably - bypasses
          # the sshpass/OpenSSH incompatibility we hit earlier.
          #
          # Credentials go in via stdin (an `open -u user,pass` command), not a `-u`/`-e` CLI
          # argument: a CLI arg lands in this process's argv, readable by anything else on the
          # runner via /proc/<pid>/cmdline or `ps -eo args` for the life of the process, bypassing
          # GitHub's log masking entirely (that only redacts the log stream, not the OS process
          # table). Certificate verification is left at lftp's own default (on) rather than
          # explicitly disabled, so the session can't be silently handed to an unverified host.
          lftp <<LFTP_SCRIPT
          set sftp:auto-confirm yes
          open -u "$USER_TRIMMED","$PW_TRIMMED" -p "$PORT" sftp://"$HOST"
          mirror -R --verbose ./_site/ "$REMOTE_DIR"
          quit
          LFTP_SCRIPT
