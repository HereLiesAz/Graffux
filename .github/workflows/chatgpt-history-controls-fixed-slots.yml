name: Apply fixed history control slots

on:
  push:
    branches:
      - chatgpt/history-controls-fixed-slots

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chatgpt/history-controls-fixed-slots
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/chatgpt_history_controls.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test app
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Commit tested fix
        run: |
          rm .github/workflows/chatgpt-history-controls-fixed-slots.yml
          rm .github/scripts/chatgpt_history_controls.py
          git config user.name ChatGPT
          git config user.email 103241502+HereLiesAz@users.noreply.github.com
          git add -A
          git commit -m "Stabilize history controls and pin AzNavRail fix [skip ci]"
          git push origin HEAD:chatgpt/history-controls-fixed-slots
