name: Temporary fix empty mappedAll crash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[empty-mappedall-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Patch zero-point catch-up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt')
          s = path.read_text()
          old = '''            if (mappedAll.size == 1) {
'''
          new = '''            if (mappedAll.isEmpty()) {
                // The bitmap copy can finish before the first sampled point is recorded. There is
                // nothing to catch up yet; later live points will draw normally after adoption.
            } else if (mappedAll.size == 1) {
'''
          if old not in s:
              raise SystemExit('mappedAll branch anchor not found')
          path.write_text(s.replace(old, new, 1))
          PY

          git config user.name 'Az'
          git config user.email '103241502+HereLiesAz@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git commit -m 'Fix empty live-stroke catch-up [empty-mappedall-fixed]'
          git push origin HEAD:main

      # temporary diagnostic workflow; delete after patch lands
