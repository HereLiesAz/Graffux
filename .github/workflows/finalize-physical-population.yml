name: Finalize Physical Population

on:
  push:
    branches:
      - ci/m2-physical-bristle-population
    paths:
      - scripts/finalize_physical_population.py
      - .github/workflows/finalize-physical-population.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/m2-physical-bristle-population
          fetch-depth: 0
      - name: Apply final physical population patch
        run: python3 scripts/finalize_physical_population.py
      - name: Commit final source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: freeze physical ferrule population geometry [skip ci]"
          git push origin HEAD:ci/m2-physical-bristle-population
