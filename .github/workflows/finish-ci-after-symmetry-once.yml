name: Finish CI after symmetry removal (one-shot)

on:
  push:
    branches: [ "fix/finish-ci-after-symmetry" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/finish-ci-after-symmetry
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply compatibility patch
        run: python tools/finish_ci_after_symmetry.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hereliesaz/graffux/MainActivity.kt .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "fix: restore released AzNavRail compatibility"
          git push origin HEAD:fix/finish-ci-after-symmetry
