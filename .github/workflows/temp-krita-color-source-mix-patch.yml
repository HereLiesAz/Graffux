name: Temp Krita Color Source Patch

on:
  push:
    branches:
      - feat/krita-color-source-mix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/krita-color-source-mix
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/temp_krita_color_source_patch.py
      - name: Commit patch and remove scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Krita color source and mix semantics"
          git push origin HEAD:feat/krita-color-source-mix
