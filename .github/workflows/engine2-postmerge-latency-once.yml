name: Engine 2 Postmerge Latency Once
on:
  push:
    branches: [perf/azphalt-engine-2-postmerge]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'track Azphalt cadence wait per sample')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/azphalt-engine-2-postmerge
      - run: python3 tools/engine2_postmerge_latency.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git commit -m 'fix(brush): track Azphalt cadence wait per sample'
          git push
