name: M2 Physical Population Alt Validation

on:
  push:
    branches:
      - ci/m2-physical-population-alt-runner
    paths:
      - .github/workflows/m2-physical-population-alt-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inject Google Services
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > app/google-services.json
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true
          dependency-graph: disabled
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest test --build-cache
      - name: Build Android debug APK
        run: ./gradlew assembleDebug --build-cache
