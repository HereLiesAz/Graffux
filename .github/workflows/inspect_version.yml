name: Patch empty live-stroke catch-up

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch EditorViewModel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt')
          s = path.read_text()
          old = '''            val catchUpPoints = snapshotStrokePoints()
            val catchUpPressures = snapshotStrokePressures()
            val mappedAll = ImageProcessor.mapScreenToBitmap(
          '''
          new = '''            val catchUpPoints = snapshotStrokePoints()
            val catchUpPressures = snapshotStrokePressures()
            if (generation != strokeGeneration || strokeLayerId != layerId || catchUpPoints.isEmpty()) {
                gpuEngine?.destroy()
                workBitmap.recycle()
                return@launch
            }
            val mappedAll = ImageProcessor.mapScreenToBitmap(
          '''
          if old not in s:
              raise SystemExit('snapshot anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''                layerScale, layerOffset, layerRotationZ
            )

            val bw = workBitmap.width.toFloat()
          '''
          new2 = '''                layerScale, layerOffset, layerRotationZ
            )
            if (mappedAll.isEmpty()) {
                gpuEngine?.destroy()
                workBitmap.recycle()
                return@launch
            }

            val bw = workBitmap.width.toFloat()
          '''
          if old2 not in s:
              raise SystemExit('mappedAll anchor not found')
          path.write_text(s.replace(old2, new2, 1))
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Az'
          git config user.email '103241502+HereLiesAz@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git commit -m 'Fix empty live-stroke catch-up [skip ci]'
          git push origin HEAD:main
