    /** Apply carried HSV dynamics without changing the stroke's alpha channel. */
    private fun resolveDabColor(colorArgb: Int, dab: Dab): Int {
        if (dab.hueShiftDeg == 0f && dab.saturationMultiplier == 1f && dab.valueMultiplier == 1f) {
            return colorArgb
        }
        val hsv = FloatArray(3)
        Color.colorToHSV(colorArgb, hsv)
        var hue = (hsv[0] + dab.hueShiftDeg) % 360f
        if (hue < 0f) hue += 360f
        hsv[0] = hue
        hsv[1] = (hsv[1] * dab.saturationMultiplier).coerceIn(0f, 1f)
        hsv[2] = (hsv[2] * dab.valueMultiplier).coerceIn(0f, 1f)
        return Color.HSVToColor(Color.alpha(colorArgb), hsv)
    }

    /**
     * Catmull-Rom changes geometry but must not invent new sensor readings. Re-sample the recorded
     * telemetry by original geometric arc fraction and replace only x/y with the curved geometry.
     */
    private fun remapSamplesToCurve(samples: List<BrushSample>, curved: List<Float>): List<BrushSample> {
        val count = curved.size / 2
        if (samples.isEmpty() || count == 0) return emptyList()
        if (samples.size == 1) {
            return List(count) { i -> samples.first().copy(x = curved[i * 2], y = curved[i * 2 + 1]) }
        }

        val sourceArc = FloatArray(samples.size)
        for (i in 1 until samples.size) {
            sourceArc[i] = sourceArc[i - 1] + hypot(samples[i].x - samples[i - 1].x, samples[i].y - samples[i - 1].y)
        }
        val curvedArc = FloatArray(count)
        for (i in 1 until count) {
            curvedArc[i] = curvedArc[i - 1] + hypot(
                curved[i * 2] - curved[(i - 1) * 2],
                curved[i * 2 + 1] - curved[(i - 1) * 2 + 1],
            )
        }
        val sourceTotal = sourceArc.last()
        val curvedTotal = curvedArc.last()

        return List(count) { i ->
            val sourceTarget = if (curvedTotal <= 1e-6f) 0f else sourceTotal * (curvedArc[i] / curvedTotal)
            var hi = 1
            while (hi < sourceArc.size && sourceArc[hi] < sourceTarget) hi++
            hi = hi.coerceAtMost(samples.lastIndex)
            val lo = (hi - 1).coerceAtLeast(0)
            val span = (sourceArc[hi] - sourceArc[lo]).coerceAtLeast(1e-6f)
            val t = ((sourceTarget - sourceArc[lo]) / span).coerceIn(0f, 1f)
            val a = samples[lo]
            val b = samples[hi]
            val cx = curved[i * 2]
            val cy = curved[i * 2 + 1]
            val heading = if (i == 0 && count > 1) {
                atan2(curved[3] - cy, curved[2] - cx) * 57.29578f
            } else if (i > 0) {
                atan2(cy - curved[(i - 1) * 2 + 1], cx - curved[(i - 1) * 2]) * 57.29578f
            } else {
                a.drawingAngleDeg
            }
            BrushSample(
                x = cx,
                y = cy,
                uptimeMillis = a.uptimeMillis + ((b.uptimeMillis - a.uptimeMillis) * t).toLong(),
                pressure = a.pressure + (b.pressure - a.pressure) * t,
                tiltRadians = a.tiltRadians + (b.tiltRadians - a.tiltRadians) * t,
                orientationRadians = a.orientationRadians + (b.orientationRadians - a.orientationRadians) * t,
                distancePx = a.distancePx + (b.distancePx - a.distancePx) * t,
                speedPxPerMs = a.speedPxPerMs + (b.speedPxPerMs - a.speedPxPerMs) * t,
                drawingAngleDeg = heading,
                predicted = false,
            )
        }
    }
'''
          s = s[:idx] + helpers + s[idx:]
          write(path, s)

          # -------------------------------------------------------------
          # DrawingEngine: replay canonical sensor data deterministically.
          # -------------------------------------------------------------
          path = 'feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/DrawingEngine.kt'
          s = read(path)
          old = '''            StampBrushRenderer.paintStroke(
                stampCanvas, pts, brush, stroke.brushColor,
                stroke.brushSize * brushScale, stroke.flow, stroke.seed, stroke.stampShape,
            )
'''
          new = '''            val mappedSamples = if (stroke.brushSamples.isNotEmpty()) {
                stroke.brushSamples.take(mapped.size).mapIndexed { i, sample ->
                    sample.copy(x = mapped[i].x, y = mapped[i].y, predicted = false)
                }
            } else {
                emptyList()
            }
            StampBrushRenderer.paintStroke(
                canvas = stampCanvas,
                points = pts,
                brush = brush,
                colorArgb = stroke.brushColor,
                diameterPx = stroke.brushSize * brushScale,
                flow = stroke.flow,
                seed = stroke.seed,
                stamp = stroke.stampShape,
                samples = mappedSamples,
            )
'''
          s = replace_once(s, old, new, 'DrawingEngine dynamic stamp replay')
          write(path, s)

          # -------------------------------------------------------------
          # Focused architecture note: Krita engine, phone-first product.
          # -------------------------------------------------------------
          doc = Path('docs/Krita Brush Engine Adoption.md')
          doc.write_text(r'''# Krita Brush Engine Adoption — Phone-First Graffux

## Product rule

Krita is a primary engineering reference for Graffux's paint engine, not its interface model.
Krita has already solved a large class of hard raster-painting problems — sensor-driven brush
parameters, response curves, deterministic dab generation, color-smudge behavior, spacing and
randomness — but its interaction model is designed around desktop/tablet-sized workspaces.
Graffux should take the engine lessons aggressively while exploiting the space Krita does not
prioritize: a serious painting tool that remains comfortable on a phone.

That gives us a non-negotiable split:

- **Under the canvas:** deep, composable, Krita-class brush machinery.
- **Over the canvas:** phone-first progressive disclosure. Drawing owns the screen; configuration
  appears transiently and leaves again.

No permanent docker forest. No shrinking the artwork to make room for a desktop control panel.
Advanced capability is allowed to be deep; it is not allowed to be permanently in the way.

## Landed foundation

Graffux now has a renderer-independent canonical `BrushSample` and a Krita-shaped sensor/curve
routing layer in `core/common/.../azphalt/BrushSensorDynamics.kt`.

A sample carries position, timestamp, pressure, tilt, orientation, travelled distance, speed and
drawing angle. Predicted samples are explicitly marked and cannot enter authoritative dab history.
The input boundary computes speed/distance in physical screen-hand space before viewport transforms,
so zooming the document does not change what the same physical hand velocity means to a brush.

Available sensors:

- pressure
- speed
- tilt
- orientation
- travelled distance
- elapsed stroke time
- drawing angle
- deterministic random per dab
- deterministic random per stroke

Available targets:

- size
- opacity
- flow
- spacing
- scatter
- rotation
- hue
- saturation
- value

Each route has an input range, output range, invert flag and authored response curve. Multiple
routes can target one parameter. Existing brushes have an empty route list and therefore continue
to use the legacy dab path exactly.

`BrushStamps.dynamicDabs()` resolves those routes at each arc-length dab. Size, opacity, scatter
and rotation are baked into the concrete `Dab`; flow and HSV modifiers travel with it to the
renderer. Seeded randomness remains deterministic across live paint and replay.

The real Android stroke path now records canonical samples alongside points/pressure. MotionEvent
supplies stylus tilt and orientation; Compose supplies pressure and historical positions/times.
Only x/y are transformed from screen to world/layer space. Commit/replay remaps those x/y positions
while preserving the recorded sensor values.

## Phone-first Brush Studio

Brush Studio keeps its compact floating-window model. The sensor engine does **not** surface as a
permanent matrix of controls.

The first dynamics surface is collapsed by default and offers one-tap mappings:

- Pressure → Size
- Pressure → Opacity
- Speed → Thin
- Tilt → Rotation

The preview feeds synthetic pressure/tilt telemetry so these mappings are visible before saving.
The underlying data model already supports arbitrary routes and curves; a later advanced editor can
open from this section without making every user navigate it for ordinary drawing.

## GPU contract

The existing Vulkan dab ABI already accepts per-dab position, radius, alpha and rotation, so size,
opacity, spacing, scatter and rotation dynamics work without changing the shader ABI.

Per-dab flow and HSV variation currently force the live stamp stroke onto the CPU renderer, because
the native API supplies one color for an entire submitted batch. This fallback is deliberate: a
correct CPU preview is preferable to a fast GPU preview that disagrees with replay. A future Vulkan
ABI revision should add packed per-dab color/flow so those routes return to the compute path.

## Next Krita systems to mine

In priority order:

1. **Color Smudge / wet-paint behavior.** Use Krita's proven separation of source color pickup,
   blending rate and opacity as the conceptual baseline for Graffux Wet Mix, implemented in Vulkan.
2. **Brush-tip and mask caching.** Cache transformed/generated masks by the parameters that actually
   invalidate them instead of regenerating work per dab.
3. **Spacing policy.** Extend dynamic spacing with airbrush/rate behavior and device-independent
   distance semantics while preserving deterministic replay.
4. **Texture/grain application.** Treat texture as a first-class mask stage with canvas-anchored and
   brush-anchored modes rather than a special renderer branch.
5. **Preset serialization/import.** Map as much of Krita's brush-preset vocabulary as makes sense
   into Azphalt's declarative format, with explicit compatibility metadata rather than silent loss.
6. **Color-source dynamics.** Gradient/mix/random color sources should feed the same per-dab resolved
   render instruction instead of becoming separate brush engines.
7. **Stroke-end/taper behavior.** Use distance/time/fade sensors plus explicit lift-off synthesis,
   keeping finger-only taper useful on phones where a stylus may not exist at all.

The test for every adoption is not “does Graffux now expose another Krita setting?” It is “did we
inherit a solved painting problem while making it faster to reach on a phone?”
''')

