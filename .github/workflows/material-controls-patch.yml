name: Material Controls Patch

on:
  push:
    branches: [ "feat/material-controls" ]
    paths: [ ".github/workflows/material-controls-patch.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/material-controls

      - name: Patch minimal material controls
        run: python scripts/patch_material_controls.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt \
            feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/ToolOptionsWindow.kt \
            app/src/main/java/com/hereliesaz/graffux/MainActivity.kt
          git diff --cached --check
          git commit -m "feat: expose minimal material controls"
          git push origin HEAD:feat/material-controls
