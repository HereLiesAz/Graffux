name: Engine 2 Native Syntax Once

on:
  push:
    branches:
      - perf/azphalt-engine-2-native

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/azphalt-engine-2-native
      - run: python3 tools/engine2_native_syntax_fix.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git commit -m 'fix(brush): correct Engine 2 native cutover structure'
          git push origin HEAD:perf/azphalt-engine-2-native
