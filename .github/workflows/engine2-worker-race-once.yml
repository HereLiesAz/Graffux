name: Engine 2 Worker Race Once

on:
  push:
    branches: [ "perf/azphalt-engine-2" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/azphalt-engine-2
          fetch-depth: 0
      - run: python3 tools/engine2_worker_race_patch.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git diff --cached --check
          git commit -m 'fix(brush): isolate live workers by stroke generation'
          git push origin HEAD:perf/azphalt-engine-2
