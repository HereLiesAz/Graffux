name: Azphalt Engine 2 Cutover

on:
  push:
    branches: [ "perf/azphalt-engine-2" ]

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/azphalt-engine-2
          fetch-depth: 0
      - name: Apply cutover
        run: python3 tools/azphalt_engine2_cutover.py
      - name: Commit cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feature/editor/src/main/java/com/hereliesaz/graffitixr/feature/editor/EditorViewModel.kt
          git diff --cached --check
          git commit -m 'perf(brush): coalesce live stamp rendering into one worker'
          git push origin HEAD:perf/azphalt-engine-2
