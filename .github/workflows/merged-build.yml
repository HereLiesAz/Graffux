name: Merged Build & Release

# Branch work is built through its pull request (pull_request -> main); `push` is main only.
# Triggering on push to every branch as well ran the full build twice per same-repo PR update
# (refs/heads/x and refs/pull/N/merge are different concurrency groups, so they never cancelled
# each other) and exposed nothing extra: a branch without a PR has nothing to gate.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A newer pull-request push cancels the older run. A push to main never does: cancelling a run
# between "upload the APK" and "move the tag" is exactly how a release ends up half-published, so
# main runs queue behind each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Token split. Every job that compiles or tests pull-request code (unit-tests, wgpu-engine-tests,
# detekt, build, repo-checks) runs with `contents: read`, checks out with persist-credentials: false
# (no token left in .git/config for a build script to read) and has no secret on disk. The jobs that
# need a write token (submit-dependency-graph, release, report-failure) run no code from the pull
# request: they only consume artifacts and the trusted scripts/ci/ of the main commit.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Only the default branch writes the Gradle cache: a pull request runs code main has not
      # reviewed, and must not be able to poison the cache the release build restores.
      # generate-and-upload keeps this job read-only; submit-dependency-graph (below) is the one
      # that holds the write token.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          dependency-graph: generate-and-upload

      - name: Make screenshot directories
        run: mkdir -p build/screenshots/{audit,chrome,design,photo,poster,rail,tab-list}

      # core:engine is Kotlin Multiplatform (android library + jvm "desktop" target): it registers
      # no testDebugUnitTest and no plain `test`, so those two tasks alone silently skip its
      # commonTest suite (BrushStamps, RoundStampCompositor, ...). Name its tasks explicitly.
      # :desktop's plain-JVM `test` (ThemeColorSyncTest, GpuStrokeParityTest, ...) is covered by
      # the `test` task. Instrumented tests (feature/editor androidTest, connectedAndroidTest) are
      # NOT run in CI: GitHub-hosted runners have no emulator/KVM, so they are run by hand on a device.
      # The *ShotTest/*UiTest classes save their renders when these directories are set.
      - name: Run unit tests
        env:
          AUDIT_SCREENSHOTS: ${{ github.workspace }}/build/screenshots/audit
          CHROME_SCREENSHOTS: ${{ github.workspace }}/build/screenshots/chrome
          DESIGN_SCREENSHOTS: ${{ github.workspace }}/build/screenshots/design
          PHOTO_SCREENSHOTS: ${{ github.workspace }}/build/screenshots/photo
          POSTER_SCREENSHOTS: ${{ github.workspace }}/build/screenshots/poster
          RAIL_SCREENSHOTS: ${{ github.workspace }}/build/screenshots/rail
          TAB_LIST_SCREENSHOTS: ${{ github.workspace }}/build/screenshots/tab-list
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest test :core:engine:desktopTest :core:engine:testAndroidHostTest --build-cache

      - name: Upload screenshots and golden diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            build/screenshots/
            **/build/screenshot-diffs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  # Submits the dependency graph that unit-tests generated. Split out because the Dependency
  # Submission API needs `contents: write`, which a job that runs pull-request code must not hold.
  # Main only: a pull request's graph is uploaded as an artifact above and never submitted.
  submit-dependency-graph:
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit

  # The Rust stamp engine's own tests (~130 #[test] functions plus tests/layout_parity.rs). Gradle
  # only ever runs `cargo build` for it, so without this job a WGSL or layout regression ships
  # green. The runner has no GPU, so Mesa's software Vulkan driver (lavapipe) is installed and
  # GRAFFUX_REQUIRE_GPU=vulkan makes a missing adapter a failure: without it the GPU tests skipped
  # themselves and this job passed having tested none of the shaders.
  #
  # RUST_TEST_THREADS=1: every GPU test builds its own wgpu Instance + Device, and the test harness
  # runs them concurrently. On the ubuntu-26.04 image that `ubuntu-latest` moved to (Vulkan loader
  # 1.4.341, Mesa/lavapipe 26.0.x) concurrent device create/destroy/vkSetDebugUtilsObjectName calls
  # race and the test binary dies with SIGSEGV (observed in adjust, direct, engine, multipass; a
  # gdb backtrace put the faulting thread inside libvulkan.so.1 under set_debug_utils_object_name
  # while another test thread was in vkDestroyDevice). On ubuntu-24.04 (loader 1.3.275, Mesa 25.2)
  # 6/6 runs pass; on 26.04 with one test thread 6/6 pass and with the default thread count the
  # job crashes on most runs. Every test still runs, in a debug build, with the GPU required.
  wgpu-engine-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - name: Run cargo test
        working-directory: core/wgpu-engine
        env:
          GRAFFUX_REQUIRE_GPU: vulkan
          RUST_TEST_THREADS: '1'
        run: cargo test --locked

  # Split from `unit-tests` so a detekt backlog (a style/lint finding, not a correctness bug)
  # can fail this check visibly without blocking `build`, which actually compiles and ships the
  # APK -- `needs:` below deliberately does not include this job. See the repo-wide
  # MaxLineLength backlog surfaced when this check first started running (PR #409): hundreds of
  # pre-existing violations, unrelated to any single change, that predate this check's existence.
  detekt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          dependency-graph: disabled

      # config/detekt/detekt.yml sets maxIssues: 0 (zero-tolerance); without this step detekt
      # findings never fail CI despite that config implying they should. The pre-existing backlog
      # is recorded in each module's detekt-baseline.xml, so only new findings fail here.
      - name: Run detekt
        run: |
          chmod +x gradlew
          ./gradlew detekt --build-cache

  # Repository rules that no compiler enforces, with their own regression tests. Plain shell and
  # Python: no Gradle, no Android SDK, nothing from the build.
  repo-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the checks
        run: |
          scripts/ci/test-check-elf-alignment.sh
          scripts/ci/test-check-ignored-tests.sh
          scripts/ci/test-rolling-release.sh
          python3 scripts/ci/test_check_r8_keep_rules.py

      # A disabled test needs an issue reference on its own line (see scripts/ci/check-ignored-tests.sh).
      - name: No disabled test without an issue
        run: scripts/ci/check-ignored-tests.sh .

      # Every JNI class the native code exports must be covered by a keep rule that actually reaches
      # R8, in the app and in every module (see scripts/ci/check_r8_keep_rules.py).
      - name: R8 keep rules cover JNI
        run: python3 scripts/ci/check_r8_keep_rules.py .

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    # Read-only: this job compiles whatever the pull request contains. Publishing is the separate
    # `release` job below, which receives only the finished APK.
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.release_vars.outputs.tag_name }}
      apk_name: ${{ steps.release_vars.outputs.apk_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Written to disk only for a push to main, i.e. code that already passed review. A pull
      # request (or a workflow_dispatch on another ref) builds without it: app/build.gradle.kts
      # skips the google-services plugin when the file is absent.
      - name: Inject Google Services
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # The unit-tests job already generates the dependency graph for this commit; keep it
          # disabled here so the build job doesn't produce a duplicate.
          dependency-graph: disabled

      # The wgpu stamp engine (core/wgpu-engine) is cross-compiled by Gradle with cargo; the runner
      # image ships rustup/cargo but not the Android target. core/nativebridge/build.gradle.kts
      # requires the library by default (only -Pgraffux.wgpu.skip=true opts out), so a missing
      # target or a cargo failure fails the build loudly instead of silently shipping an APK
      # without libgraffux_wgpu.so. (-Pgraffux.wgpu.require is read only by :desktop, which this
      # job does not build.)
      - name: Add the Rust Android targets (arm64-v8a, armeabi-v7a)
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No env: block on purpose. No GITHUB_TOKEN/GH_TOKEN and no signing secrets here: this
      # process tree resolves and executes every Gradle plugin and third-party dependency (and,
      # on a PR, whatever build.gradle.kts the pushed code contains). assembleDebug signs with
      # the default debug keystore (app/build.gradle.kts), so the release keystore is neither
      # needed nor decoded in this workflow; release signing happens in HereLiesAz/workflows'
      # android-play-release.yml / android-github-release.yml.
      - name: Build with Gradle
        run: ./gradlew assembleDebug --build-cache

      # Google Play requires 16 KB page-size alignment for apps targeting Android 15+. Nothing else
      # notices a 4 KB-aligned library: it loads fine on today's phones.
      - name: Native libraries are 16 KB aligned
        run: scripts/ci/check-elf-alignment.sh app/build/outputs/apk/debug/*.apk

      # Nothing in this workflow or the Gradle build increments anything. version.properties holds
      # the fields last recorded by HereLiesAz/workflows' Android release workflows (versionMajor/
      # Minor/Patch/Build); this rolling debug release only reuses it to NAME the artifact. The real
      # release versionCode/versionName are decided by that workflow (highest code Play has accepted
      # + 1) and passed to Gradle as -P properties. NEVER derive a version from the git commit count.
      - name: Name the rolling debug APK
        id: release_vars
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          prop() { grep "^$1=" version.properties | cut -d= -f2 | tr -d '\r '; }
          version="$(prop versionMajor).$(prop versionMinor).$(prop versionPatch).$(prop versionBuild)"
          tag="latest-debug-v$(prop versionMajor).$(prop versionMinor)"
          app_name="$(sed -nE "s/^[[:space:]]*rootProject\.name[[:space:]]*=[[:space:]]*[\"']([^\"']+)[\"'].*/\1/p" settings.gradle.kts settings.gradle 2>/dev/null | head -1)"
          apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          [ -n "$apk" ] || { echo "::error::No APK found to release" >&2; exit 1; }
          name="${app_name:-App}-${version}-debug.apk"
          mkdir -p release
          cp "$apk" "release/$name"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK for the release job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 3

  # Publishes the rolling debug release. The only job that writes to the repository, and it runs
  # nothing from a pull request: it checks out only scripts/ci/ of the main commit and downloads the
  # finished APK. Restricted to main so two branches can never race for the one shared tag.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: release

      # upload -> move tag -> edit text, never the other way round (scripts/ci/rolling-release.sh).
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          scripts/ci/rolling-release.sh "$TAG_NAME" "$GITHUB_SHA" "release/$APK_NAME" \
            "Latest Debug Build ($TAG_NAME)" "Auto-build from commit $GITHUB_SHA"

  # Files one issue per failing ref. Runs no pull-request code, so it can hold `issues: write`.
  report-failure:
    needs: build
    if: always() && needs.build.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report Failure to Jules
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // The raw build log is deliberately NOT embedded here: GitHub's secret masking rewrites
            // the live log stream, not this script's API request body. Link to the run instead.
            // De-duplicated: one open issue per ref. A failing branch/PR used to file a new issue
            // (pinging external agents) on every push.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const assignee = 'gemini-code-assist';
            const title = `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`;
            const body = `@${assignee} /jules debug this build error\n\nBuild log: ${runUrl}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'jules,bug',
              per_page: 100,
            });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure on this ref: ${runUrl}`,
              });
              return;
            }

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['jules', 'bug'],
                assignees: [assignee]
              });
            } catch (error) {
              console.log("Failed to create issue with assignee. Retrying without assignee.");
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['jules', 'bug']
              });
            }
