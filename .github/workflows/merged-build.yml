name: Merged Build & Release

# Branch work is built through its pull request (pull_request -> main); `push` is main only.
# Triggering on push to every branch as well ran the full build twice per same-repo PR update
# (refs/heads/x and refs/pull/N/merge are different concurrency groups, so they never cancelled
# each other) and exposed nothing extra: a branch without a PR has nothing to gate.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# ⚡ Concurrency: Cancels the entire job if a new push comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actually least-privilege now: `contents: read` at the top so a job that declares no
# permissions block of its own (there are none left that don't) gets the minimum. Both jobs
# below declare their own elevated grant explicitly, scoped to what they actually use.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # contents: write is for the dependency-graph submission below (generate-submit-and-upload
    # needs it to call the Dependency Submission API) — not for anything else in this job.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      # core:engine is Kotlin Multiplatform (android library + jvm "desktop" target): it registers
      # no testDebugUnitTest and no plain `test`, so those two tasks alone silently skip its
      # commonTest suite (BrushStamps, RoundStampCompositor, ...). Name its tasks explicitly.
      # :desktop's plain-JVM `test` (ThemeColorSyncTest, GpuStrokeParityTest, ...) is covered by
      # the `test` task. Instrumented tests (feature/editor androidTest, connectedAndroidTest) are
      # NOT run in CI: GitHub-hosted runners have no emulator/KVM, so they are run by hand on a device.
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest test :core:engine:desktopTest :core:engine:testAndroidHostTest --build-cache

  # The Rust stamp engine's own tests (~130 #[test] functions plus tests/layout_parity.rs). Gradle
  # only ever runs `cargo build` for it, so without this job a WGSL or layout regression ships
  # green. GPU-dependent tests skip themselves when the runner exposes no wgpu adapter.
  wgpu-engine-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run cargo test
        working-directory: core/wgpu-engine
        run: cargo test --locked

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  # Split from `unit-tests` so a detekt backlog (a style/lint finding, not a correctness bug)
  # can fail this check visibly without blocking `build-and-release`, which actually compiles
  # and ships the APK — `needs:` below deliberately does not include this job. See the repo-wide
  # MaxLineLength backlog surfaced when this check first started running (PR #409): hundreds of
  # pre-existing violations, unrelated to any single change, that predate this check's existence.
  detekt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      # config/detekt/detekt.yml sets maxIssues: 0 (zero-tolerance); without this step detekt
      # findings never fail CI despite that config implying they should. The pre-existing backlog
      # is recorded in each module's detekt-baseline.xml, so only new findings fail here.
      - name: Run detekt
        run: |
          chmod +x gradlew
          ./gradlew detekt --build-cache

  build-and-release:
    needs: unit-tests
    runs-on: ubuntu-latest
    # contents: write — pushes the rolling debug tag and creates/edits/uploads to the release.
    # issues: write — "Report Failure to Jules" files an issue on a failed build.
    # No pull-requests or checks scope: nothing in this job calls either API.
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          # The unit-tests job already generates, submits and uploads the dependency graph for
          # this commit; keep it disabled here so the build job doesn't submit a duplicate.
          # 'true' is not a valid value for setup-gradle@v6 (enum: disabled / generate /
          # generate-and-submit / generate-submit-and-upload / generate-and-upload /
          # download-and-submit), which failed the action before the build could start.
          dependency-graph: disabled

      # The wgpu stamp engine (core/wgpu-engine) is cross-compiled by Gradle with cargo; the runner
      # image ships rustup/cargo but not the Android target. core/nativebridge/build.gradle.kts
      # requires the library by default (only -Pgraffux.wgpu.skip=true opts out), so a missing
      # target or a cargo failure fails the build loudly instead of silently shipping an APK
      # without libgraffux_wgpu.so. (-Pgraffux.wgpu.require is read only by :desktop, which this
      # job does not build.)
      - name: Add the Rust Android targets (arm64-v8a, armeabi-v7a)
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle-build
        # No env: block on purpose. No GITHUB_TOKEN/GH_TOKEN and no signing secrets here: this
        # process tree resolves and executes every Gradle plugin and third-party dependency (and,
        # on a PR, whatever build.gradle.kts the pushed code contains). assembleDebug signs with
        # the default debug keystore (app/build.gradle.kts), so the release keystore is neither
        # needed nor decoded in this workflow; release signing happens in HereLiesAz/workflows'
        # android-play-release.yml / android-github-release.yml.
        run: |
          set +e

          # Build the debug APK (signed with the default debug keystore)
          ./gradlew assembleDebug --build-cache > build.log 2>&1

          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat build.log
          exit $EXIT_CODE

      # ------------------------------------------------------------------
      # FAILURE HANDLING
      # ------------------------------------------------------------------
      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // The raw build log is deliberately NOT embedded here: GitHub's secret masking rewrites
            // the live log stream, not this script's API request body. Link to the run instead.
            // De-duplicated: one open issue per ref. A failing branch/PR used to file a new issue
            // (pinging external agents) on every push.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const assignee = 'gemini-code-assist';
            const title = `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`;
            const body = `@${assignee} /jules debug this build error\n\nBuild log: ${runUrl}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'jules,bug',
              per_page: 100,
            });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure on this ref: ${runUrl}`,
              });
              return;
            }

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['jules', 'bug'],
                assignees: [assignee]
              });
            } catch (error) {
              console.log("Failed to create issue with assignee. Retrying without assignee.");
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['jules', 'bug']
              });
            }

      # ------------------------------------------------------------------
      # RELEASE STEPS (only on a push to main — see the race-condition note below)
      # ------------------------------------------------------------------
      #
      # Restricted to main, not "any push": these steps force-move ONE shared tag
      # (latest-debug-v$MAJOR.$MINOR) and --clobber the same GitHub release regardless of which
      # branch triggered them. The job-level `concurrency: group: ${{ github.workflow }}-${{
      # github.ref }}` only serializes pushes to the SAME ref — it does nothing for two different
      # branches racing each other. Push branch X, then branch Y ~30s later: X's tag move can land
      # after Y's `gh release edit --target $GITHUB_SHA`, leaving the release's metadata pointing
      # at Y's commit while its uploaded APK is X's — wrong on both sides, and neither run fails.
      # Scoping to main removes the race outright: only one branch can ever reach this step, and
      # same-ref pushes to main are already correctly serialized by the concurrency group above.
      - name: Prepare Release Variables
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_vars
        run: |
          # Nothing in this workflow or the Gradle build increments anything. version.properties holds
          # the fields last recorded by HereLiesAz/workflows' Android release workflows after a
          # publish (versionMajor/Minor/Patch/Build); this rolling debug release only reuses it to
          # NAME the artifact. The real release versionCode/versionName are decided by that
          # workflow (highest code Play has accepted + 1) and passed to Gradle as -P properties.
          # NEVER derive a version from the git commit count.
          MAJOR=$(grep '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          MINOR=$(grep '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          PATCH=$(grep '^versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          BUILD_NUMBER=$(grep '^versionBuild=' version.properties | cut -d'=' -f2 | tr -d '\r ')

          VERSION_NAME="$MAJOR.$MINOR.$PATCH.$BUILD_NUMBER"
          
          TAG_NAME="latest-debug-v${MAJOR}.${MINOR}"
          
          # Dynamic App Name from settings.gradle
          if [ -f "settings.gradle.kts" ]; then
             APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          elif [ -f "settings.gradle" ]; then
             APP_NAME=$(grep 'rootProject.name' settings.gradle | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          else
             APP_NAME="App"
          fi
          
          # Locate built APK
          APK_ORIGINAL=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -z "$APK_ORIGINAL" ]; then
             echo "Error: No APK found to release!"
             exit 1
          fi

          TARGET_NAME="${APP_NAME}-${VERSION_NAME}-debug.apk"
          
          # Rename for release
          mv "$APK_ORIGINAL" "$TARGET_NAME"
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "APK_FILE=$TARGET_NAME" >> $GITHUB_ENV
          
          # Package Build Tools (Optional)
          mkdir -p build_tools_package/tools build_tools_package/native
          [ -d "app/src/main/assets/tools" ] && cp -r app/src/main/assets/tools/* build_tools_package/tools/ || true
          [ -d "app/src/main/jniLibs/arm64-v8a" ] && cp -r app/src/main/jniLibs/arm64-v8a/* build_tools_package/native/ || true
          cd build_tools_package && zip -r ../build-tools.zip . && cd ..

      - name: Publish Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force update tag to point to current commit
          git tag -fa $TAG_NAME -m "Latest Debug Build"
          git push origin $TAG_NAME --force

          BUILD_TOOLS="build-tools.zip"

          # Check if release exists
          if gh release view $TAG_NAME > /dev/null 2>&1; then
             echo "Updating existing release..."

             # Clean up ONLY the build-tools asset to avoid conflicts
             gh release delete-asset "$TAG_NAME" "$BUILD_TOOLS" -y || true

             gh release edit $TAG_NAME --prerelease \
               --title "Latest Debug Build ($TAG_NAME)" \
               --notes "Auto-build from commit $GITHUB_SHA" \
               --target $GITHUB_SHA

             # Clobber ensures that if we re-run the workflow on the exact same commit, it replaces the APK instead of failing.
             gh release upload $TAG_NAME "$APK_FILE" --clobber
             [ -f "$BUILD_TOOLS" ] && gh release upload $TAG_NAME "$BUILD_TOOLS" --clobber
          else
             echo "Creating new release..."
             gh release create $TAG_NAME "$APK_FILE" --prerelease \
               --title "Latest Debug Build ($TAG_NAME)" \
               --notes "Auto-build from commit $GITHUB_SHA" \
               --target $GITHUB_SHA
             [ -f "$BUILD_TOOLS" ] && gh release upload $TAG_NAME "$BUILD_TOOLS" --clobber
          fi
