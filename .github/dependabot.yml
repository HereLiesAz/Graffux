# Dependabot configuration — keeps Gradle dependencies and GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      androidx-lifecycle:
        patterns:
          - "androidx.lifecycle*"
      camerax:
        patterns:
          - "androidx.camera*"
      compose:
        patterns:
          - "androidx.compose*"
          - "org.jetbrains.kotlin.plugin.compose"
      navigation:
        patterns:
          - "androidx.navigation*"
      room:
        patterns:
          - "androidx.room*"
      hilt:
        patterns:
          - "com.google.dagger*"
          - "androidx.hilt*"
      okhttp-retrofit:
        patterns:
          - "com.squareup.okhttp3*"
          - "com.squareup.retrofit2*"
      netty:
        patterns:
          - "io.netty*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
        exclude-patterns:
          - "org.jetbrains.kotlin.plugin.compose"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
